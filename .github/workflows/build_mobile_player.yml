name: Build Stalker IPTV Mobile Player APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/stalkeriptv
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "StalkerIPTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # Required by Media3/AndroidX.
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.stalkeriptv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.stalkeriptv'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.8.0'
              implementation 'androidx.media3:media3-ui:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#0A0F1E</color>
              <color name="surface">#121A2B</color>
              <color name="surface2">#1B2740</color>
              <color name="accent">#36D1DC</color>
              <color name="accent2">#5B86E5</color>
              <color name="text">#F5F7FA</color>
              <color name="muted">#9AA7BD</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#0A0F1E</item>
                  <item name="android:navigationBarColor">#070B14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="false"
                  android:label="Stalker IPTV Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/stalkeriptv/MainActivity.java <<'EOF'
          package com.example.stalkeriptv;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.*;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.Map;
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.AspectRatioFrameLayout;
          import androidx.media3.ui.PlayerView;
          
          @UnstableApi
          public class MainActivity extends Activity {
              private static final int BG=Color.rgb(7,11,20), SURFACE=Color.rgb(15,22,36);
              private static final int SURFACE2=Color.rgb(25,36,57), ACCENT=Color.rgb(54,209,220);
              private static final int BLUE=Color.rgb(70,110,220), TEXT=Color.rgb(245,247,250);
              private static final int MUTED=Color.rgb(150,164,186);
          
              private LinearLayout root, listBox, playerPage;
              private EditText portalEdit, macEdit, searchEdit;
              private TextView status, pageLabel, playerTitle;
              private String workingPortal="", token="", mac="";
              private int mode=0, page=1;
              private ArrayList<JSONObject> currentItems=new ArrayList<>();
              private ArrayList<JSONObject> playerItems=new ArrayList<>();
              private ExoPlayer player;
              private PlayerView playerView;
              private boolean menuVisible=true, fillVideo=false;
          
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  showLogin();
              }
          
              private GradientDrawable bg(int c,float r) {
                  GradientDrawable g=new GradientDrawable(); g.setColor(c); g.setCornerRadius(r); return g;
              }
              private TextView tv(String s,float z,int c) {
                  TextView t=new TextView(this); t.setText(s); t.setTextSize(z); t.setTextColor(c); return t;
              }
              private Button btn(String s) {
                  Button b=new Button(this); b.setText(s); b.setTextColor(TEXT); b.setTextSize(12);
                  b.setAllCaps(false); b.setBackground(bg(SURFACE2,20)); return b;
              }
          
              private void showLogin() {
                  LinearLayout r=new LinearLayout(this); r.setOrientation(LinearLayout.VERTICAL);
                  r.setPadding(24,28,24,24); r.setBackgroundColor(BG);
                  ScrollView sv=new ScrollView(this); LinearLayout box=new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL); box.setPadding(0,55,0,20);
                  TextView brand=tv("STALKER IPTV",30,TEXT); brand.setTypeface(null,1); box.addView(brand);
                  TextView sub=tv("Mobile IPTV Player",16,MUTED); sub.setPadding(0,5,0,25); box.addView(sub);
          
                  LinearLayout card=new LinearLayout(this); card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(20,20,20,20); card.setBackground(bg(SURFACE,28));
          
                  portalEdit=new EditText(this); portalEdit.setHint("Portal URL"); portalEdit.setSingleLine();
                  portalEdit.setTextColor(TEXT); portalEdit.setHintTextColor(MUTED); portalEdit.setPadding(16,0,16,0);
                  portalEdit.setBackground(bg(SURFACE2,18)); card.addView(portalEdit,new LinearLayout.LayoutParams(-1,58));
          
                  macEdit=new EditText(this); macEdit.setHint("Authorized MAC address"); macEdit.setSingleLine();
                  macEdit.setTextColor(TEXT); macEdit.setHintTextColor(MUTED); macEdit.setPadding(16,0,16,0);
                  macEdit.setBackground(bg(SURFACE2,18));
                  LinearLayout.LayoutParams mp=new LinearLayout.LayoutParams(-1,58); mp.topMargin=12; card.addView(macEdit,mp);
          
                  Button connect=btn("CONNECT"); connect.setTextSize(15); connect.setBackground(bg(BLUE,22));
                  LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,58); cp.topMargin=16; card.addView(connect,cp);
                  status=tv("Authorized portal and MAC only.",13,MUTED); status.setPadding(3,15,3,0); card.addView(status);
                  box.addView(card);
                  box.addView(tv("
LIVE  •  VOD  •  SERIES
Search  •  Pagination  •  Full-screen player",14,MUTED));
                  sv.addView(box); r.addView(sv); setContentView(r);
                  connect.setOnClickListener(v->connect());
              }
          
              private void connect() {
                  String p=portalEdit.getText().toString().trim();
                  mac=macEdit.getText().toString().trim().toUpperCase();
                  if(p.isEmpty()||mac.isEmpty()){status.setText("Portal and MAC are required.");return;}
                  if(!mac.matches("([0-9A-F]{2}:){5}[0-9A-F]{2}")){status.setText("Invalid MAC format.");return;}
                  status.setText("Connecting...");
                  new Thread(()->{
                      try{
                          workingPortal=normalize(p);
                          JSONObject h=getJson(workingPortal+"?type=stb&action=handshake&JsHttpRequest=1-xml&mac="+enc(mac));
                          JSONObject js=h.optJSONObject("js");
                          if(js==null||js.optString("token","").isEmpty()) throw new Exception("Handshake failed");
                          token=js.optString("token","");
                          if(token.startsWith("~")) token=token.substring(1);
                          getJson(workingPortal+"?type=account_info&action=get_main_info&JsHttpRequest=1-xml");
                          runOnUiThread(this::showHome);
                      }catch(Exception e){runOnUiThread(()->status.setText("Connection failed: "+e.getMessage()));}
                  }).start();
              }
          
              private void showHome() {
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(BG);
                  LinearLayout top=new LinearLayout(this); top.setGravity(Gravity.CENTER_VERTICAL); top.setPadding(12,6,10,4);
                  LinearLayout titles=new LinearLayout(this); titles.setOrientation(LinearLayout.VERTICAL);
                  TextView title=tv("STALKER IPTV PRO",18,TEXT); title.setTypeface(null,1); titles.addView(title);
                  status=tv("Connected",11,MUTED); titles.addView(status);
                  top.addView(titles,new LinearLayout.LayoutParams(0,64,1));
                  Button exit=btn("EXIT"); exit.setOnClickListener(v->{stopPlayer();showLogin();});
                  top.addView(exit,new LinearLayout.LayoutParams(76,44)); root.addView(top);
          
                  LinearLayout tabs=new LinearLayout(this); tabs.setPadding(8,3,8,3); tabs.setBackgroundColor(Color.rgb(5,9,17));
                  Button live=btn("LIVE"), vod=btn("VOD"), series=btn("SERIES");
                  tabs.addView(live,new LinearLayout.LayoutParams(0,48,1));
                  tabs.addView(vod,new LinearLayout.LayoutParams(0,48,1));
                  tabs.addView(series,new LinearLayout.LayoutParams(0,48,1));
                  live.setOnClickListener(v->switchMode(0)); vod.setOnClickListener(v->switchMode(1)); series.setOnClickListener(v->switchMode(2));
                  root.addView(tabs);
          
                  LinearLayout searchRow=new LinearLayout(this); searchRow.setPadding(12,8,12,6);
                  searchEdit=new EditText(this); searchEdit.setHint("Search channels / titles"); searchEdit.setSingleLine();
                  searchEdit.setTextColor(TEXT); searchEdit.setHintTextColor(MUTED); searchEdit.setPadding(16,0,16,0);
                  searchEdit.setBackground(bg(SURFACE,20)); searchRow.addView(searchEdit,new LinearLayout.LayoutParams(0,50,1));
                  Button search=btn("SEARCH"); search.setOnClickListener(v->draw(currentItems));
                  LinearLayout.LayoutParams sp=new LinearLayout.LayoutParams(92,50); sp.leftMargin=7; searchRow.addView(search,sp);
                  root.addView(searchRow);
          
                  ScrollView sv=new ScrollView(this); listBox=new LinearLayout(this); listBox.setOrientation(LinearLayout.VERTICAL);
                  listBox.setPadding(12,3,12,8); sv.addView(listBox); root.addView(sv,new LinearLayout.LayoutParams(-1,0,1));
          
                  LinearLayout pager=new LinearLayout(this); pager.setGravity(Gravity.CENTER); pager.setPadding(6,5,6,7);
                  Button prev=btn("‹"), next=btn("›"); pageLabel=tv("Page 1",13,TEXT); pageLabel.setGravity(Gravity.CENTER);
                  pager.addView(prev,new LinearLayout.LayoutParams(65,45)); pager.addView(pageLabel,new LinearLayout.LayoutParams(105,45)); pager.addView(next,new LinearLayout.LayoutParams(65,45));
                  prev.setOnClickListener(v->{if(page>1){page--;loadMode();}});
                  next.setOnClickListener(v->{page++;loadMode();});
                  root.addView(pager); setContentView(root); loadMode();
              }
          
              private void switchMode(int m){mode=m;page=1;loadMode();}
              private void loadMode(){
                  pageLabel.setText("Page "+page);
                  status.setText(mode==0?"Loading channels...":mode==1?"Loading VOD...":"Loading SERIES...");
                  new Thread(()->{
                      try{
                          ArrayList<JSONObject> r=mode==0?getLive(page):mode==1?getVod(page):getSeries(page);
                          currentItems=r; runOnUiThread(()->draw(r));
                      }catch(Exception e){runOnUiThread(()->status.setText("Load error: "+e.getMessage()));}
                  }).start();
              }
          
              private void draw(ArrayList<JSONObject> items){
                  if(listBox==null)return; listBox.removeAllViews(); String q=searchEdit==null?"":searchEdit.getText().toString().trim().toLowerCase();
                  int n=0;
                  for(JSONObject x:items){
                      String name=x.optString("name",x.optString("title","Item"));
                      if(!q.isEmpty()&&!name.toLowerCase().contains(q))continue;
                      listBox.addView(itemCard(x,name)); n++;
                  }
                  status.setText(n+" items");
              }
          
              private View itemCard(JSONObject x,String name){
                  LinearLayout c=new LinearLayout(this); c.setOrientation(LinearLayout.HORIZONTAL); c.setGravity(Gravity.CENTER_VERTICAL);
                  c.setPadding(10,7,8,7); c.setBackground(bg(SURFACE,18));
                  TextView ic=tv(mode==0?"▶":mode==1?"▣":"◆",21,ACCENT); ic.setGravity(Gravity.CENTER);
                  c.addView(ic,new LinearLayout.LayoutParams(45,66));
                  LinearLayout info=new LinearLayout(this); info.setOrientation(LinearLayout.VERTICAL);
                  TextView nm=tv(name,15,TEXT); nm.setTypeface(null,1); info.addView(nm);
                  info.addView(tv(mode==0?"Live channel":mode==1?"Movie":"Series",11,MUTED));
                  c.addView(info,new LinearLayout.LayoutParams(0,66,1));
                  Button a=btn(mode==2?"OPEN":"PLAY");
                  if(mode==0){a.setOnClickListener(v->playLive(x));c.setOnClickListener(v->playLive(x));}
                  else if(mode==1){a.setOnClickListener(v->playVod(x));c.setOnClickListener(v->playVod(x));}
                  else {a.setOnClickListener(v->openSeries(x));c.setOnClickListener(v->openSeries(x));}
                  c.addView(a,new LinearLayout.LayoutParams(75,44));
                  LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,78); cp.bottomMargin=7;
                  FrameLayout f=new FrameLayout(this); f.addView(c,new FrameLayout.LayoutParams(-1,-1)); return wrap(f,cp);
              }
              private View wrap(View v,LinearLayout.LayoutParams p){FrameLayout f=(FrameLayout)v; f.setLayoutParams(p);return f;}
          
              private ArrayList<JSONObject> getLive(int p)throws Exception{
                  JSONObject d=getJson(workingPortal+"?type=itv&action=get_all_channels&JsHttpRequest=1-xml");
                  ArrayList<JSONObject> a=extractArray(d);
                  if(a.isEmpty()){
                      for(int pg=1;pg<=30;pg++){
                          JSONObject z=getJson(workingPortal+"?type=itv&action=get_ordered_list&JsHttpRequest=1-xml&type_itv=1&p="+pg);
                          ArrayList<JSONObject> b=extractArray(z); if(b.isEmpty())break; a.addAll(b);
                          if(b.size()<20)break;
                      }
                  }
                  return unique(a,"id");
              }
              private ArrayList<JSONObject> getVod(int p)throws Exception{
                  return unique(extractArray(getJson(workingPortal+"?type=vod&action=get_ordered_list&JsHttpRequest=1-xml&p="+p+"&items_per_page=30")),"id");
              }
              private ArrayList<JSONObject> getSeries(int p)throws Exception{
                  return unique(extractArray(getJson(workingPortal+"?type=series&action=get_ordered_list&JsHttpRequest=1-xml&p="+p+"&items_per_page=30")),"id");
              }
              private ArrayList<JSONObject> unique(ArrayList<JSONObject>a,String k){
                  ArrayList<JSONObject> o=new ArrayList<>(); java.util.HashSet<String>s=new java.util.HashSet<>();
                  for(JSONObject x:a){String v=x.optString(k,"");if(!v.isEmpty()&&s.add(v))o.add(x);}return o;
              }
          
              private ArrayList<JSONObject> extractArray(JSONObject d){
                  ArrayList<JSONObject> o=new ArrayList<>(); JSONObject js=d.optJSONObject("js"); if(js==null)return o;
                  JSONArray a=js.optJSONArray("data"); if(a==null)a=js.optJSONArray("results"); if(a==null)a=js.optJSONArray("items");
                  if(a!=null){for(int i=0;i<a.length();i++){JSONObject x=a.optJSONObject(i);if(x!=null)o.add(x);}}
                  else{
                      Object data=js.opt("data");
                      if(data instanceof JSONObject){JSONObject x=(JSONObject)data; o.add(x);}
                  }
                  return o;
              }
          
              private void playLive(JSONObject x){
                  String id=x.optString("id","");
                  new Thread(()->{try{
                      JSONObject d=getJson(workingPortal+"?type=itv&action=create_link&JsHttpRequest=1-xml&cmd="+enc("ffmpeg http://localhost/ch/"+id));
                      openStream(extractUrl(d),x.optString("name","Channel"));
                  }catch(Exception e){runOnUiThread(()->toast("LIVE: "+e.getMessage()));}}).start();
              }
              private void playVod(JSONObject x){
                  String id=x.optString("id",x.optString("movie_id",""));
                  new Thread(()->{try{
                      JSONObject d;
                      try{d=getJson(workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));}
                      catch(Exception first){d=getJson(workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));}
                      openStream(extractUrl(d),x.optString("name","Movie"));
                  }catch(Exception e){runOnUiThread(()->toast("VOD: "+e.getMessage()));}}).start();
              }
              private void openSeries(JSONObject x){
                  String id=x.optString("id",x.optString("series_id",""));
                  new Thread(()->{try{
                      ArrayList<JSONObject>a=new ArrayList<>();
                      String[] qs={
                          workingPortal+"?type=series&action=get_ordered_list&JsHttpRequest=1-xml&movie_id="+enc(id)+"&p=1",
                          workingPortal+"?type=series&action=get_episodes&JsHttpRequest=1-xml&series_id="+enc(id)+"&p=1",
                          workingPortal+"?type=vod&action=get_ordered_list&JsHttpRequest=1-xml&movie_id="+enc(id)+"&p=1"};
                      for(String q:qs){try{a=extractArray(getJson(q));if(!a.isEmpty())break;}catch(Exception ignored){}}
                      final ArrayList<JSONObject> ep=a;
                      runOnUiThread(()->showEpisodes(x.optString("name","Series"),ep));
                  }catch(Exception e){runOnUiThread(()->toast("Series: "+e.getMessage()));}}).start();
              }
              private void showEpisodes(String name,ArrayList<JSONObject> eps){
                  listBox.removeAllViews(); TextView back=tv("←  "+name,19,TEXT); back.setPadding(6,7,6,16); back.setOnClickListener(v->loadMode()); listBox.addView(back);
                  for(JSONObject e:eps){
                      String t=e.optString("name",e.optString("title","Episode"));
                      Button b=btn("▶  "+t); b.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL); b.setOnClickListener(v->playEpisode(e));
                      LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,56);p.bottomMargin=7;listBox.addView(b,p);
                  }
                  status.setText(eps.size()+" episodes");
              }
              private void playEpisode(JSONObject e){
                  String id=e.optString("id",e.optString("episode_id",""));
                  new Thread(()->{try{
                      JSONObject d;
                      try{d=getJson(workingPortal+"?type=series&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));}
                      catch(Exception first){d=getJson(workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));}
                      openStream(extractUrl(d),e.optString("name","Episode"));
                  }catch(Exception ex){runOnUiThread(()->toast("Episode: "+ex.getMessage()));}}).start();
              }
          
              private String extractUrl(JSONObject d)throws Exception{
                  JSONObject js=d.optJSONObject("js"); if(js==null)throw new Exception("Portal returned no stream");
                  String u=js.optString("cmd",js.optString("url",js.optString("link",js.optString("stream_url",""))));
                  if(u.isEmpty())throw new Exception("Portal returned no stream URL");
                  u=u.trim().replace("\"","");
                  int h=u.indexOf("http://"), hs=u.indexOf("https://"); int at=h>=0?h:hs;
                  if(at>0)u=u.substring(at);
                  if(u.startsWith("ffmpeg "))u=u.substring(7).trim(); if(u.startsWith("vlc "))u=u.substring(4).trim();
                  return u;
              }
          
              private void openStream(String stream,String title){
                  runOnUiThread(()->{
                      try{
                          stopPlayer();
                          playerItems=new ArrayList<>(currentItems);
                          playerPage=new LinearLayout(this); playerPage.setOrientation(LinearLayout.VERTICAL); playerPage.setBackgroundColor(Color.BLACK);
          
                          LinearLayout bar=new LinearLayout(this); bar.setGravity(Gravity.CENTER_VERTICAL); bar.setPadding(7,4,7,4); bar.setBackgroundColor(SURFACE);
                          Button back=btn("‹"); Button menu=btn("MENU"); Button fit=btn("FIT"); Button full=btn("FULL");
                          playerTitle=tv(title,13,TEXT); playerTitle.setSingleLine(true);
                          bar.addView(back,new LinearLayout.LayoutParams(45,42)); bar.addView(playerTitle,new LinearLayout.LayoutParams(0,42,1));
                          bar.addView(menu,new LinearLayout.LayoutParams(62,42)); bar.addView(fit,new LinearLayout.LayoutParams(55,42)); bar.addView(full,new LinearLayout.LayoutParams(62,42));
                          playerPage.addView(bar);
          
                          FrameLayout videoBox=new FrameLayout(this); videoBox.setBackgroundColor(Color.BLACK);
                          playerView=new PlayerView(this); playerView.setUseController(true); playerView.setKeepScreenOn(true);
                          playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);
                          videoBox.addView(playerView,new FrameLayout.LayoutParams(-1,-1));
                          playerPage.addView(videoBox,new LinearLayout.LayoutParams(-1,0,1));
          
                          TextView listTitle=tv("CHANNEL MENU",12,ACCENT); listTitle.setPadding(12,7,12,4);
                          playerPage.addView(listTitle);
                          ScrollView sv=new ScrollView(this); LinearLayout channels=new LinearLayout(this); channels.setOrientation(LinearLayout.VERTICAL); channels.setPadding(8,2,8,8); sv.addView(channels);
                          playerPage.addView(sv,new LinearLayout.LayoutParams(-1,0,0.72f));
          
                          if(playerItems.isEmpty()) playerItems.addAll(currentItems);
                          for(JSONObject x:playerItems){
                              String n=x.optString("name",x.optString("title","Channel"));
                              Button cb=btn(n); cb.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);
                              cb.setOnClickListener(v->{if(mode==0)playLive(x);else if(mode==1)playVod(x);else openSeries(x);});
                              LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,49);cp.bottomMargin=4;channels.addView(cb,cp);
                          }
          
                          setContentView(playerPage);
                          menu.setOnClickListener(v->{menuVisible=!menuVisible;listTitle.setVisibility(menuVisible?View.VISIBLE:View.GONE);sv.setVisibility(menuVisible?View.VISIBLE:View.GONE);});
                          fit.setOnClickListener(v->{fillVideo=!fillVideo;playerView.setResizeMode(fillVideo?AspectRatioFrameLayout.RESIZE_MODE_ZOOM:AspectRatioFrameLayout.RESIZE_MODE_FIT);fit.setText(fillVideo?"FIT":"FILL");});
                          full.setOnClickListener(v->toggleFullscreen());
                          back.setOnClickListener(v->{exitFullscreen();stopPlayer();showHome();});
          
                          Map<String,String> headers=new HashMap<>();
                          headers.put("User-Agent","Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");
                          headers.put("X-User-Agent","Model: MAG250; Link: WiFi");
                          headers.put("Referer","http://localhost/stalker_portal/c/");
                          headers.put("Cookie","mac="+mac+"; stb_lang=en; timezone=Europe/London");
                          if(!token.isEmpty())headers.put("Authorization","Bearer "+token);
          
                          DefaultHttpDataSource.Factory http=new DefaultHttpDataSource.Factory()
                                  .setAllowCrossProtocolRedirects(true).setDefaultRequestProperties(headers);
                          DefaultMediaSourceFactory media=new DefaultMediaSourceFactory(http);
                          player=new ExoPlayer.Builder(this).setMediaSourceFactory(media).build();
                          playerView.setPlayer(player);
                          player.addListener(new Player.Listener(){
                              @Override public void onPlayerError(PlaybackException e){toast("Playback failed: "+(e.getMessage()==null?"unsupported stream":e.getMessage()));}
                          });
                          player.setMediaItem(MediaItem.fromUri(Uri.parse(stream))); player.prepare(); player.play();
                      }catch(Exception e){toast("Player error: "+e.getMessage());}
                  });
              }
          
              private void toggleFullscreen(){
                  int f=getWindow().getDecorView().getSystemUiVisibility();
                  boolean on=(f&View.SYSTEM_UI_FLAG_FULLSCREEN)!=0;
                  if(on)exitFullscreen();else{
                      getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  }
              }
              private void exitFullscreen(){getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);getWindow().getDecorView().setSystemUiVisibility(0);}
              private void stopPlayer(){if(player!=null){player.release();player=null;}}
          
              @Override public void onBackPressed(){
                  if(player!=null){exitFullscreen();stopPlayer();showHome();}else super.onBackPressed();
              }
              @Override protected void onDestroy(){stopPlayer();super.onDestroy();}
          
              private JSONObject getJson(String s)throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(s).openConnection();
                  c.setConnectTimeout(12000);c.setReadTimeout(25000);c.setRequestMethod("GET");
                  c.setRequestProperty("User-Agent","Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");
                  c.setRequestProperty("X-User-Agent","Model: MAG250; Link: WiFi");c.setRequestProperty("Accept","*/*");
                  c.setRequestProperty("Referer","http://localhost/stalker_portal/c/");
                  c.setRequestProperty("Cookie","mac="+mac+"; stb_lang=en; timezone=Europe/London");
                  if(!token.isEmpty())c.setRequestProperty("Authorization","Bearer "+token);
                  int code=c.getResponseCode(); if(code<200||code>=300)throw new Exception("HTTP "+code);
                  BufferedReader r=new BufferedReader(new InputStreamReader(c.getInputStream()));StringBuilder b=new StringBuilder();String l;
                  while((l=r.readLine())!=null)b.append(l);r.close();c.disconnect();return new JSONObject(b.toString());
              }
              private String normalize(String p){p=p.trim();while(p.endsWith("/"))p=p.substring(0,p.length()-1);if(p.endsWith("/portal.php"))return p;if(p.endsWith("/c"))return p+"/portal.php";return p+"/c/portal.php";}
              private String enc(String s)throws Exception{return URLEncoder.encode(s,"UTF-8");}
              private void toast(String s){runOnUiThread(()->Toast.makeText(this,s,Toast.LENGTH_LONG).show());}
          }
          EOF

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StalkerIPTV-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
