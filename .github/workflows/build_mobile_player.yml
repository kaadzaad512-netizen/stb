name: Build Stalker IPTV Mobile Player APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/stalkeriptv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "StalkerIPTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          # Required by Media3/AndroidX.
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.stalkeriptv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.stalkeriptv'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.8.0'
              implementation 'androidx.media3:media3-ui:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
          }
          EOF

          cat > app/src/main/res/drawable/logo_mark.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#E94D8C" android:pathData="M24,2 A22,22 0,1 0,24,46 A22,22 0,1 0,24,2"/>
              <path android:fillColor="#FFFFFF" android:pathData="M20,14 L35,24 L20,34 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#0A0F1E</color>
              <color name="surface">#121A2B</color>
              <color name="surface2">#1B2740</color>
              <color name="accent">#36D1DC</color>
              <color name="accent2">#5B86E5</color>
              <color name="text">#F5F7FA</color>
              <color name="muted">#9AA7BD</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#0A0F1E</item>
                  <item name="android:navigationBarColor">#070B14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="false"
                  android:label="Stalker IPTV Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/stalkeriptv/MainActivity.java <<'EOF'
          package com.example.stalkeriptv;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.*;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Map;
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.AspectRatioFrameLayout;
          import androidx.media3.ui.PlayerView;
          
          @UnstableApi
          public class MainActivity extends Activity {
              private static final int BG=Color.rgb(9,14,31);
              private static final int SURFACE=Color.rgb(27,27,48);
              private static final int SURFACE2=Color.rgb(29,42,75);
              private static final int NAVY=Color.rgb(24,36,70);
              private static final int PINK=Color.rgb(233,77,140);
              private static final int PINK2=Color.rgb(176,48,101);
              private static final int TEXT=Color.rgb(244,244,248);
              private static final int MUTED=Color.rgb(171,174,190);
              private static final int GOLD=Color.rgb(255,181,45);
          
              private LinearLayout root, listBox, playerPage;
              private EditText portalEdit, macEdit, searchEdit;
              private TextView status, pageLabel, playerTitle;
              private String workingPortal="", token="", mac="";
              private int mode=1, page=1;
              private ArrayList<JSONObject> currentItems=new ArrayList<>();
              private ArrayList<JSONObject> playerItems=new ArrayList<>();
              private ExoPlayer player;
              private PlayerView playerView;
              private boolean fillVideo=false;
          
              @Override public void onCreate(Bundle b){
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(Color.rgb(20,24,45));
                  showLogin();
              }
          
              private GradientDrawable bg(int c,float r){GradientDrawable g=new GradientDrawable();g.setColor(c);g.setCornerRadius(r);return g;}
              private GradientDrawable strokeBg(int fill,int stroke,float radius,int width){GradientDrawable g=bg(fill,radius);g.setStroke(width,stroke);return g;}
              private TextView tv(String s,float z,int c){TextView t=new TextView(this);t.setText(s);t.setTextSize(z);t.setTextColor(c);return t;}
              private Button btn(String s){Button b=new Button(this);b.setText(s);b.setTextColor(TEXT);b.setTextSize(12);b.setAllCaps(false);b.setPadding(8,0,8,0);b.setBackground(bg(SURFACE2,22));return b;}
          
              private void showLogin(){
                  LinearLayout r=new LinearLayout(this);r.setOrientation(LinearLayout.VERTICAL);r.setPadding(24,30,24,24);r.setBackgroundColor(BG);
                  ScrollView sv=new ScrollView(this);LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(0,50,0,20);
                  LinearLayout brandRow=new LinearLayout(this);brandRow.setGravity(Gravity.CENTER_VERTICAL);
                  ImageView logo=new ImageView(this);logo.setImageResource(com.example.stalkeriptv.R.drawable.logo_mark);brandRow.addView(logo,new LinearLayout.LayoutParams(54,54));
                  LinearLayout brandText=new LinearLayout(this);brandText.setOrientation(LinearLayout.VERTICAL);brandText.setPadding(12,0,0,0);
                  TextView brand=tv("STALKER IPTV",28,TEXT);brand.setTypeface(null,1);brandText.addView(brand);brandText.addView(tv("Movies • Live • Series",14,MUTED));brandRow.addView(brandText);box.addView(brandRow);
                  TextView sub=tv("Premium mobile player",15,MUTED);sub.setPadding(0,8,0,25);box.addView(sub);
          
                  LinearLayout card=new LinearLayout(this);card.setOrientation(LinearLayout.VERTICAL);card.setPadding(20,20,20,20);card.setBackground(bg(SURFACE,28));
                  portalEdit=new EditText(this);portalEdit.setHint("Portal URL");portalEdit.setSingleLine();portalEdit.setTextColor(TEXT);portalEdit.setHintTextColor(MUTED);portalEdit.setPadding(16,0,16,0);portalEdit.setBackground(bg(SURFACE2,18));card.addView(portalEdit,new LinearLayout.LayoutParams(-1,58));
                  macEdit=new EditText(this);macEdit.setHint("Authorized MAC address");macEdit.setSingleLine();macEdit.setTextColor(TEXT);macEdit.setHintTextColor(MUTED);macEdit.setPadding(16,0,16,0);macEdit.setBackground(bg(SURFACE2,18));LinearLayout.LayoutParams mp=new LinearLayout.LayoutParams(-1,58);mp.topMargin=12;card.addView(macEdit,mp);
                  Button connect=btn("CONNECT");connect.setTextSize(15);connect.setBackground(bg(PINK,22));LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,58);cp.topMargin=16;card.addView(connect,cp);
                  status=tv("Authorized portal and MAC only.",13,MUTED);status.setPadding(3,15,3,0);card.addView(status);box.addView(card);
                  TextView note=tv("\nVOD posters • Search • Favorites style • Full-screen player",14,MUTED);box.addView(note);
                  sv.addView(box);r.addView(sv);setContentView(r);connect.setOnClickListener(v->connect());
              }
          
              private void connect(){
                  String p=portalEdit.getText().toString().trim();mac=macEdit.getText().toString().trim().toUpperCase();
                  if(p.isEmpty()||mac.isEmpty()){status.setText("Portal and MAC are required.");return;}
                  if(!mac.matches("([0-9A-F]{2}:){5}[0-9A-F]{2}")){status.setText("Invalid MAC format.");return;}
                  status.setText("Connecting...");
                  new Thread(()->{try{
                      workingPortal=normalize(p);
                      JSONObject h=getJson(workingPortal+"?type=stb&action=handshake&JsHttpRequest=1-xml&mac="+enc(mac));
                      JSONObject js=h.optJSONObject("js");if(js==null||js.optString("token","").isEmpty())throw new Exception("Handshake failed");
                      token=js.optString("token","");if(token.startsWith("~"))token=token.substring(1);
                      try{getJson(workingPortal+"?type=account_info&action=get_main_info&JsHttpRequest=1-xml");}catch(Exception ignored){}
                      runOnUiThread(()->showHome());
                  }catch(Exception e){runOnUiThread(()->status.setText("Connection failed: "+e.getMessage()));}}).start();
              }
          
              private void showHome(){
                  root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(BG);
                  LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);top.setPadding(12,8,12,5);top.setBackgroundColor(BG);
                  ImageView logo=new ImageView(this);logo.setImageResource(com.example.stalkeriptv.R.drawable.logo_mark);top.addView(logo,new LinearLayout.LayoutParams(45,45));
                  LinearLayout titles=new LinearLayout(this);titles.setOrientation(LinearLayout.VERTICAL);titles.setPadding(10,0,0,0);
                  TextView title=tv("STALKER",18,TEXT);title.setTypeface(null,1);titles.addView(title);status=tv("Connected",11,MUTED);titles.addView(status);top.addView(titles,new LinearLayout.LayoutParams(0,58,1));
                  Button menu=btn("☰");menu.setTextSize(21);menu.setOnClickListener(v->showHomeDrawer());top.addView(menu,new LinearLayout.LayoutParams(52,48));root.addView(top);
          
                  LinearLayout searchRow=new LinearLayout(this);searchRow.setPadding(12,3,12,8);
                  searchEdit=new EditText(this);searchEdit.setHint("Search movies, channels, series");searchEdit.setSingleLine();searchEdit.setTextColor(TEXT);searchEdit.setHintTextColor(MUTED);searchEdit.setPadding(17,0,17,0);searchEdit.setBackground(bg(SURFACE,20));searchRow.addView(searchEdit,new LinearLayout.LayoutParams(0,52,1));
                  Button search=btn("⌕");search.setTextSize(22);search.setOnClickListener(v->draw(currentItems));LinearLayout.LayoutParams sp=new LinearLayout.LayoutParams(58,52);sp.leftMargin=7;searchRow.addView(search,sp);root.addView(searchRow);
          
                  LinearLayout tabs=new LinearLayout(this);tabs.setPadding(10,2,10,8);tabs.setBackgroundColor(BG);
                  Button live=btn("LIVE"),vod=btn("MOVIES"),series=btn("SERIES");tabs.addView(live,new LinearLayout.LayoutParams(0,45,1));tabs.addView(vod,new LinearLayout.LayoutParams(0,45,1));tabs.addView(series,new LinearLayout.LayoutParams(0,45,1));
                  live.setOnClickListener(v->switchMode(0));vod.setOnClickListener(v->switchMode(1));series.setOnClickListener(v->switchMode(2));root.addView(tabs);
          
                  ScrollView sv=new ScrollView(this);listBox=new LinearLayout(this);listBox.setOrientation(LinearLayout.VERTICAL);listBox.setPadding(10,2,10,10);sv.addView(listBox);root.addView(sv,new LinearLayout.LayoutParams(-1,0,1));
                  LinearLayout pager=new LinearLayout(this);pager.setGravity(Gravity.CENTER);pager.setPadding(8,5,8,7);Button prev=btn("‹"),next=btn("›");pageLabel=tv("Page 1",13,TEXT);pageLabel.setGravity(Gravity.CENTER);pager.addView(prev,new LinearLayout.LayoutParams(62,44));pager.addView(pageLabel,new LinearLayout.LayoutParams(100,44));pager.addView(next,new LinearLayout.LayoutParams(62,44));prev.setOnClickListener(v->{if(page>1){page--;loadMode();}});next.setOnClickListener(v->{page++;loadMode();});root.addView(pager);
          
                  LinearLayout nav=new LinearLayout(this);nav.setGravity(Gravity.CENTER);nav.setPadding(8,5,8,6);nav.setBackgroundColor(Color.rgb(23,27,50));
                  String[] labels={"⌂","▣","▶","♥","⚙"};for(int i=0;i<labels.length;i++){final int k=i;Button n=btn(labels[i]);n.setTextSize(21);n.setTextColor(i==(mode==1?1:0)?PINK:MUTED);n.setOnClickListener(v->{if(k==0)switchMode(0);else if(k==1)switchMode(1);else if(k==2)switchMode(2);});nav.addView(n,new LinearLayout.LayoutParams(0,50,1));}root.addView(nav);
                  setContentView(root);loadMode();
              }
          
              private void showHomeDrawer(){
                  final PopupWindow pop=new PopupWindow(this);LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(10,10,10,10);box.setBackground(bg(Color.rgb(31,31,54),22));
                  TextView h=tv("MENU",17,TEXT);h.setTypeface(null,1);h.setPadding(10,8,10,12);box.addView(h);
                  String[] a={"All","Favorites","Live TV","Movies","Series","4K"};int[] modes={0,0,0,1,2,1};for(int i=0;i<a.length;i++){final int k=i;Button b=btn(a[i]);b.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);b.setOnClickListener(v->{pop.dismiss();switchMode(modes[k]);});box.addView(b,new LinearLayout.LayoutParams(220,48));}
                  pop.setContentView(box);pop.setWidth(240);pop.setHeight(-2);pop.setBackgroundDrawable(bg(Color.rgb(31,31,54),22));pop.setOutsideTouchable(true);pop.setFocusable(true);pop.showAtLocation(root,Gravity.TOP|Gravity.RIGHT,12,72);
              }
          
              private void switchMode(int m){mode=m;page=1;loadMode();}
              private void loadMode(){
                  if(pageLabel!=null)pageLabel.setText("Page "+page);if(status!=null)status.setText(mode==0?"Loading live TV...":mode==1?"Loading movies...":"Loading series...");
                  new Thread(()->{try{ArrayList<JSONObject> r=mode==0?getLive(page):mode==1?getVod(page):getSeries(page);currentItems=r;runOnUiThread(()->draw(r));}catch(Exception e){runOnUiThread(()->status.setText("Load error: "+e.getMessage()));}}).start();
              }
          
              private void draw(ArrayList<JSONObject> items){
                  if(listBox==null)return;listBox.removeAllViews();String q=searchEdit==null?"":searchEdit.getText().toString().trim().toLowerCase();ArrayList<JSONObject> filtered=new ArrayList<>();
                  for(JSONObject x:items){String name=x.optString("name",x.optString("title","Item"));if(!q.isEmpty()&&!name.toLowerCase().contains(q))continue;filtered.add(x);}
                  if(filtered.isEmpty()){TextView empty=tv("No items found",16,MUTED);empty.setGravity(Gravity.CENTER);empty.setPadding(0,50,0,50);listBox.addView(empty);status.setText("0 items");return;}
                  int posterH=mode==0?105:205;
                  for(int i=0;i<filtered.size();i+=2){LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);row.setPadding(0,0,0,8);row.setGravity(Gravity.TOP);row.addView(itemCard(filtered.get(i),posterH),new LinearLayout.LayoutParams(0,-2,1));if(i+1<filtered.size())row.addView(itemCard(filtered.get(i+1),posterH),new LinearLayout.LayoutParams(0,-2,1));else{Space sp=new Space(this);row.addView(sp,new LinearLayout.LayoutParams(0,1,1));}listBox.addView(row);}
                  status.setText(filtered.size()+" items");
              }
          
              private View itemCard(JSONObject x,int posterH){
                  String name=x.optString("name",x.optString("title","Item"));LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(5,5,5,5);c.setBackground(bg(SURFACE,18));
                  ImageView poster=new ImageView(this);poster.setScaleType(ImageView.ScaleType.CENTER_CROP);poster.setBackground(bg(SURFACE2,16));poster.setImageResource(com.example.stalkeriptv.R.drawable.logo_mark);c.addView(poster,new LinearLayout.LayoutParams(-1,posterH));loadPoster(poster,posterUrl(x));
                  LinearLayout meta=new LinearLayout(this);meta.setOrientation(LinearLayout.VERTICAL);meta.setPadding(8,7,8,5);TextView nm=tv(name,14,TEXT);nm.setTypeface(null,1);nm.setMaxLines(2);meta.addView(nm);
                  String year=x.optString("year","");String rating=x.optString("rating",x.optString("rate",""));String kind=mode==0?"LIVE":mode==1?"MOVIE":"SERIES";String line=kind+(year.isEmpty()?"":"  •  "+year)+(rating.isEmpty()?"":"  ★ "+rating);TextView inf=tv(line,11,rating.isEmpty()?MUTED:GOLD);inf.setPadding(0,4,0,0);meta.addView(inf);c.addView(meta,new LinearLayout.LayoutParams(-1,-2));
                  c.setOnClickListener(v->{if(mode==0)playLive(x);else if(mode==1)playVod(x);else openSeries(x);});LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(4,2,4,2);c.setLayoutParams(p);return c;
              }
          
              private String posterUrl(JSONObject x){String[] keys={"screenshot_uri","poster","poster_url","cover","cover_big","pic","image","logo","logo_url"};for(String k:keys){String u=x.optString(k,"");if(!u.isEmpty())return resolveUrl(u);}return "";}
              private String resolveUrl(String u){try{if(u.startsWith("http://")||u.startsWith("https://"))return u;return new URL(new URL(workingPortal),u).toString();}catch(Exception e){return u;}}
              private void loadPoster(ImageView target,String u){if(u==null||u.isEmpty())return;new Thread(()->{HttpURLConnection c=null;try{URL url=new URL(u);c=(HttpURLConnection)url.openConnection();c.setConnectTimeout(8000);c.setReadTimeout(12000);c.setRequestProperty("User-Agent","Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");c.setRequestProperty("Referer","http://localhost/stalker_portal/c/");c.setRequestProperty("Cookie","mac="+mac+"; stb_lang=en; timezone=Europe/London");if(!token.isEmpty())c.setRequestProperty("Authorization","Bearer "+token);Bitmap bm=BitmapFactory.decodeStream(c.getInputStream());if(bm!=null)runOnUiThread(()->target.setImageBitmap(bm));}catch(Exception ignored){}finally{if(c!=null)c.disconnect();}}).start();}
          
              private ArrayList<JSONObject> getLive(int p)throws Exception{JSONObject d=getJson(workingPortal+"?type=itv&action=get_all_channels&JsHttpRequest=1-xml");ArrayList<JSONObject>a=extractArray(d);if(a.isEmpty()){for(int pg=1;pg<=30;pg++){JSONObject z=getJson(workingPortal+"?type=itv&action=get_ordered_list&JsHttpRequest=1-xml&type_itv=1&p="+pg);ArrayList<JSONObject>b=extractArray(z);if(b.isEmpty())break;a.addAll(b);if(b.size()<20)break;}}return unique(a,"id");}
              private ArrayList<JSONObject> getVod(int p)throws Exception{JSONObject d=getJson(workingPortal+"?type=vod&action=get_ordered_list&JsHttpRequest=1-xml&p="+p+"&items_per_page=30");ArrayList<JSONObject>a=extractArray(d);if(a.isEmpty()){d=getJson(workingPortal+"?type=vod&action=get_ordered_list&JsHttpRequest=1-xml&p="+p);a=extractArray(d);}return unique(a,"id");}
              private ArrayList<JSONObject> getSeries(int p)throws Exception{return unique(extractArray(getJson(workingPortal+"?type=series&action=get_ordered_list&JsHttpRequest=1-xml&p="+p+"&items_per_page=30")),"id");}
              private ArrayList<JSONObject> unique(ArrayList<JSONObject>a,String k){ArrayList<JSONObject>o=new ArrayList<>();HashSet<String>s=new HashSet<>();for(JSONObject x:a){String v=x.optString(k,"");if(v.isEmpty()||s.add(v))o.add(x);}return o;}
              private ArrayList<JSONObject> extractArray(JSONObject d){ArrayList<JSONObject>o=new ArrayList<>();JSONObject js=d.optJSONObject("js");if(js==null)return o;JSONArray a=js.optJSONArray("data");if(a==null)a=js.optJSONArray("results");if(a==null)a=js.optJSONArray("items");if(a!=null){for(int i=0;i<a.length();i++){JSONObject x=a.optJSONObject(i);if(x!=null)o.add(x);}}else{Object data=js.opt("data");if(data instanceof JSONObject)o.add((JSONObject)data);}return o;}
          
              private void playLive(JSONObject x){String id=x.optString("id","");new Thread(()->{try{JSONObject d=getJson(workingPortal+"?type=itv&action=create_link&JsHttpRequest=1-xml&cmd="+enc("ffmpeg http://localhost/ch/"+id));openStream(extractUrl(d),x.optString("name","Channel"));}catch(Exception e){runOnUiThread(()->toast("LIVE: "+e.getMessage()));}}).start();}
          
              private void playVod(JSONObject x){
                  String id=x.optString("id",x.optString("movie_id",""));String direct=firstUrl(x,"cmd","stream_url","url","link");
                  if(!direct.isEmpty()){openStream(resolveUrl(cleanStream(direct)),x.optString("name","Movie"));return;}
                  new Thread(()->{try{
                      JSONObject d=null;Exception last=null;String[] qs={
                          workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id),
                          workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id),
                          workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id),
                          workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&id="+enc(id)};
                      for(String q:qs){try{d=getJson(q);String u=extractUrl(d);if(!u.isEmpty()){openStream(u,x.optString("name","Movie"));return;}}catch(Exception e){last=e;}}
                      throw new Exception(last==null?"VOD stream unavailable":last.getMessage());
                  }catch(Exception e){runOnUiThread(()->toast("VOD: "+e.getMessage()));}}).start();
              }
          
              private String firstUrl(JSONObject x,String...keys){for(String k:keys){String u=x.optString(k,"");if(u.contains("http://")||u.contains("https://"))return u;}return "";}
              private String cleanStream(String u){u=u.trim().replace("\\\"","").replace("\"","");int h=u.indexOf("http://"),hs=u.indexOf("https://");int at=h>=0?h:hs;if(at>0)u=u.substring(at);if(u.startsWith("ffmpeg "))u=u.substring(7).trim();if(u.startsWith("vlc "))u=u.substring(4).trim();return u;}
              private void openSeries(JSONObject x){String id=x.optString("id",x.optString("series_id",""));new Thread(()->{try{ArrayList<JSONObject>a=new ArrayList<>();String[]qs={workingPortal+"?type=series&action=get_ordered_list&JsHttpRequest=1-xml&movie_id="+enc(id)+"&p=1",workingPortal+"?type=series&action=get_episodes&JsHttpRequest=1-xml&series_id="+enc(id)+"&p=1",workingPortal+"?type=vod&action=get_ordered_list&JsHttpRequest=1-xml&movie_id="+enc(id)+"&p=1"};for(String q:qs){try{a=extractArray(getJson(q));if(!a.isEmpty())break;}catch(Exception ignored){}}final ArrayList<JSONObject>ep=a;runOnUiThread(()->showEpisodes(x.optString("name","Series"),ep));}catch(Exception e){runOnUiThread(()->toast("Series: "+e.getMessage()));}}).start();}
              private void showEpisodes(String name,ArrayList<JSONObject>eps){listBox.removeAllViews();TextView back=tv("←  "+name,19,TEXT);back.setPadding(6,7,6,16);back.setOnClickListener(v->loadMode());listBox.addView(back);for(JSONObject e:eps){String t=e.optString("name",e.optString("title","Episode"));Button b=btn("▶  "+t);b.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);b.setOnClickListener(v->playEpisode(e));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,56);p.bottomMargin=7;listBox.addView(b,p);}status.setText(eps.size()+" episodes");}
              private void playEpisode(JSONObject e){String id=e.optString("id",e.optString("episode_id",""));String direct=firstUrl(e,"cmd","stream_url","url","link");if(!direct.isEmpty()){openStream(cleanStream(direct),e.optString("name","Episode"));return;}new Thread(()->{try{JSONObject d;try{d=getJson(workingPortal+"?type=series&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));}catch(Exception first){d=getJson(workingPortal+"?type=vod&action=create_link&JsHttpRequest=1-xml&movie_id="+enc(id)+"&cmd="+enc("ffmpeg http://localhost/movie/"+id));}openStream(extractUrl(d),e.optString("name","Episode"));}catch(Exception ex){runOnUiThread(()->toast("Episode: "+ex.getMessage()));}}).start();}
          
              private String extractUrl(JSONObject d)throws Exception{JSONObject js=d.optJSONObject("js");if(js==null)throw new Exception("Portal returned no stream");String u=firstUrl(js,"cmd","url","link","stream_url");if(u.isEmpty())u=firstUrl(d,"cmd","url","link","stream_url");if(u.isEmpty())throw new Exception("Portal returned no stream URL");return cleanStream(u);}
          
              private void openStream(String stream,String title){runOnUiThread(()->{try{if(stream==null||stream.isEmpty())throw new Exception("Empty stream URL");stopPlayer();playerItems=new ArrayList<>(currentItems);playerPage=new LinearLayout(this);playerPage.setOrientation(LinearLayout.VERTICAL);playerPage.setBackgroundColor(Color.BLACK);
                  LinearLayout bar=new LinearLayout(this);bar.setGravity(Gravity.CENTER_VERTICAL);bar.setPadding(7,4,7,4);bar.setBackgroundColor(SURFACE);Button back=btn("‹");Button menu=btn("MENU");Button fit=btn("FIT");Button full=btn("FULL");playerTitle=tv(title,13,TEXT);playerTitle.setSingleLine(true);bar.addView(back,new LinearLayout.LayoutParams(45,42));bar.addView(playerTitle,new LinearLayout.LayoutParams(0,42,1));bar.addView(menu,new LinearLayout.LayoutParams(62,42));bar.addView(fit,new LinearLayout.LayoutParams(55,42));bar.addView(full,new LinearLayout.LayoutParams(62,42));playerPage.addView(bar);
                  FrameLayout videoBox=new FrameLayout(this);videoBox.setBackgroundColor(Color.BLACK);playerView=new PlayerView(this);playerView.setUseController(true);playerView.setKeepScreenOn(true);playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);videoBox.addView(playerView,new FrameLayout.LayoutParams(-1,-1));playerPage.addView(videoBox,new LinearLayout.LayoutParams(-1,0,0.55f));
                  TextView listTitle=tv("UP NEXT",12,PINK);listTitle.setPadding(12,7,12,4);playerPage.addView(listTitle);ScrollView sv=new ScrollView(this);LinearLayout channels=new LinearLayout(this);channels.setOrientation(LinearLayout.VERTICAL);channels.setPadding(8,2,8,8);sv.addView(channels);playerPage.addView(sv,new LinearLayout.LayoutParams(-1,0,0.45f));
                  if(playerItems.isEmpty())playerItems.addAll(currentItems);for(JSONObject xx:playerItems){String n=xx.optString("name",xx.optString("title","Item"));Button cb=btn("▶  "+n);cb.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);cb.setOnClickListener(v->{if(mode==0)playLive(xx);else if(mode==1)playVod(xx);else openSeries(xx);});LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,49);cp.bottomMargin=4;channels.addView(cb,cp);}setContentView(playerPage);
                  menu.setOnClickListener(v->{boolean show=sv.getVisibility()!=View.VISIBLE;listTitle.setVisibility(show?View.VISIBLE:View.GONE);sv.setVisibility(show?View.VISIBLE:View.GONE);});fit.setOnClickListener(v->{fillVideo=!fillVideo;playerView.setResizeMode(fillVideo?AspectRatioFrameLayout.RESIZE_MODE_ZOOM:AspectRatioFrameLayout.RESIZE_MODE_FIT);fit.setText(fillVideo?"FIT":"FILL");});full.setOnClickListener(v->toggleFullscreen());back.setOnClickListener(v->{exitFullscreen();stopPlayer();showHome();});
                  Map<String,String> headers=new HashMap<>();headers.put("User-Agent","Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");headers.put("X-User-Agent","Model: MAG250; Link: WiFi");headers.put("Referer","http://localhost/stalker_portal/c/");headers.put("Cookie","mac="+mac+"; stb_lang=en; timezone=Europe/London");if(!token.isEmpty())headers.put("Authorization","Bearer "+token);
                  DefaultHttpDataSource.Factory http=new DefaultHttpDataSource.Factory().setAllowCrossProtocolRedirects(true).setDefaultRequestProperties(headers);DefaultMediaSourceFactory media=new DefaultMediaSourceFactory(http);player=new ExoPlayer.Builder(this).setMediaSourceFactory(media).build();playerView.setPlayer(player);player.addListener(new Player.Listener(){@Override public void onPlayerError(PlaybackException e){toast("Playback failed: "+(e.getMessage()==null?"unsupported stream":e.getMessage()));}});player.setMediaItem(MediaItem.fromUri(Uri.parse(stream)));player.prepare();player.play();
              }catch(Exception e){toast("Player error: "+e.getMessage());}});}
          
              private void toggleFullscreen(){int f=getWindow().getDecorView().getSystemUiVisibility();boolean on=(f&View.SYSTEM_UI_FLAG_FULLSCREEN)!=0;if(on)exitFullscreen();else{getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);}}
              private void exitFullscreen(){getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);getWindow().getDecorView().setSystemUiVisibility(0);}
              private void stopPlayer(){if(player!=null){player.release();player=null;}}
              @Override public void onBackPressed(){if(player!=null){exitFullscreen();stopPlayer();showHome();}else super.onBackPressed();}
              @Override protected void onDestroy(){stopPlayer();super.onDestroy();}
          
              private JSONObject getJson(String s)throws Exception{HttpURLConnection c=(HttpURLConnection)new URL(s).openConnection();c.setConnectTimeout(12000);c.setReadTimeout(25000);c.setRequestMethod("GET");c.setRequestProperty("User-Agent","Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3");c.setRequestProperty("X-User-Agent","Model: MAG250; Link: WiFi");c.setRequestProperty("Accept","*/*");c.setRequestProperty("Referer","http://localhost/stalker_portal/c/");c.setRequestProperty("Cookie","mac="+mac+"; stb_lang=en; timezone=Europe/London");if(!token.isEmpty())c.setRequestProperty("Authorization","Bearer "+token);int code=c.getResponseCode();if(code<200||code>=300)throw new Exception("HTTP "+code);BufferedReader r=new BufferedReader(new InputStreamReader(c.getInputStream()));StringBuilder b=new StringBuilder();String l;while((l=r.readLine())!=null)b.append(l);r.close();c.disconnect();return new JSONObject(b.toString());}
              private String normalize(String p){p=p.trim();while(p.endsWith("/"))p=p.substring(0,p.length()-1);if(p.endsWith("/portal.php"))return p;if(p.endsWith("/c"))return p+"/portal.php";return p+"/c/portal.php";}
              private String enc(String s)throws Exception{return URLEncoder.encode(s,"UTF-8");}
              private void toast(String s){runOnUiThread(()->Toast.makeText(this,s,Toast.LENGTH_LONG).show());}
          }
