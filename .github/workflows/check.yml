name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build System Properties
        run: |
          mkdir -p app/src/main/java/com/stb/iptv app/src/main/res/values app/src/main/res/drawable
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = "StalkerIPTV"; include(":app")' > settings.gradle.kts
          echo 'plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.24" apply false }' > build.gradle.kts
          
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Build Module Specifications
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.stb.iptv"; compileSdk = 34
              defaultConfig { applicationId = "com.stb.iptv"; minSdk = 24; targetSdk = 34; versionCode = 3; versionName = "3.0" }
              buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
          }
          EOF

      - name: Build Android Manifest Configuration
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="STB Player Pro" android:usesCleartextTraffic="true" android:theme="@style/Theme.App">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo '<resources><style name="Theme.App" parent="android:Theme.Material.NoActionBar"><item name="android:windowBackground">#0B1020</item></style></resources>' > app/src/main/res/values/themes.xml

      - name: Build Core View Elements
        run: |
          cat > app/src/main/java/com/stb/iptv/MainActivity.kt <<'EOF'
          package com.stb.iptv
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Color(0xFF22C55E))) {
                          Surface(Modifier.fillMaxSize()) {
                              Column(Modifier.padding(16.dp)) {
                                  Text("STB Player Pro Engine Initialized", style = MaterialTheme.typography.headlineMedium)
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Compile and Bundle Package
        run: gradle --no-daemon assembleDebug

      - name: Deliver Compiled APK Binaries
        uses: actions/upload-artifact@v4
        with:
          name: stalker-iptv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
