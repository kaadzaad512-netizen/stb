name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Gradle Automation Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Auto-Create Architecture and File Matrix
        run: |
          # 1. Structure the basic application modules layout
          mkdir -p app/src/main/java/com/stb/iptv app/src/main/res/values app/src/main/res/drawable
          
          # 2. Inject condensed engine system configurations
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = "StalkerIPTV"; include(":app")' > settings.gradle.kts
          echo 'plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.24" apply false }' > build.gradle.kts
          echo -e 'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true' > gradle.properties

      - name: Pull Core Components
        run: |
          # Automatically downloads the large backend models directly into the generated folders
          # to completely prevent character copying size limitations and terminal cutoffs.
          curl -sSL "https://githubusercontent.com{{ github.repository }}/${{ github.ref_name }}/app/build.gradle.kts" -o app/build.gradle.kts || true
          curl -sSL "https://githubusercontent.com{{ github.repository }}/${{ github.ref_name }}/app/src/main/AndroidManifest.xml" -o app/src/main/AndroidManifest.xml || true

      - name: Compile Application Layout
        run: gradle --no-daemon assembleDebug

      - name: Deliver Compiled APK Binaries
        uses: actions/upload-artifact@v4
        with:
          name: stalker-iptv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
