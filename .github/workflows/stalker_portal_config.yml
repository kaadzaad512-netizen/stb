app:
  name: Stalker Portal IPTV Player
  version: '4.3'
  platform:
  - console
  - Termux
  - Pydroid
  - Android
  - Windows
  - macOS
portal:
  url: ''
  auto_prefix_http: true
  candidates:
  - '{portal}/c/portal.php'
  - '{portal}/portal.php'
  - '{portal}/server/portal.php'
  timeout_seconds: 12
stalker:
  user_agent: 'Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like
    Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3'
  x_user_agent: 'Model: MAG250; Link: WiFi'
  referer: http://localhost/stalker_portal/c/
  cookies:
    stb_lang: en
    timezone: Europe/London
  js_http_request: 1-xml
  actions:
    handshake:
      type: stb
      action: handshake
    get_profile:
      type: stb
      action: get_profile
    get_main_info:
      type: account_info
      action: get_main_info
    get_genres:
      type: itv
      action: get_genres
    get_all_channels:
      type: itv
      action: get_all_channels
    get_ordered_list:
      type: itv
      action: get_ordered_list
      type_itv: '1'
      pagination_parameter: p
    create_link:
      type: itv
      action: create_link
      cmd_template: ffmpeg http://localhost/ch/{channel_id}
mac:
  manual_format: 00:1A:79:D1:FC:C2
  normalize: true
  generator:
    enabled: true
    prefix: 00:1A:79
    random_octets: 3
    max_attempts: 2000000
    workers: 50
    save_file: found_mac.json
account:
  expiry_field: phone
  zero_dates:
  - ''
  - '0000-00-00'
  - '0000-00-00 00:00:00'
  - '1970-01-01 00:00:00'
  accepted_formats:
  - '%Y-%m-%d %H:%M:%S'
  - '%Y-%m-%d'
channels:
  load_all_first: true
  fallback: get_ordered_list
  deduplicate_by: id
  fields:
    id: id
    name: name
    number: number
    genre_id: tv_genre_id
playback:
  preferred_players:
  - vlc
  - mpv
  android:
    mime_type: video/*
    activities:
      vlc: org.videolan.vlc/org.videolan.vlc.gui.video.VideoPlayerActivity
      mpv: is.xyz.mpv/.MPVActivity
    packages:
      vlc: org.videolan.vlc
      mpv: is.xyz.mpv
  desktop:
    vlc_paths:
    - C:\Program Files\VideoLAN\VLC\vlc.exe
    - C:\Program Files (x86)\VideoLAN\VLC\vlc.exe
    mpv_paths:
    - C:\Program Files\mpv\mpv.exe
    - C:\Program Files (x86)\mpv\mpv.exe
menu:
- list_all_channels
- browse_by_genre
- search_channel_by_name
- account_info
- play_channel_by_number
- exit
ui:
  colors:
    red: \033[91m
    green: \033[92m
    yellow: \033[93m
    blue: \033[94m
    magenta: \033[95m
    cyan: \033[96m
    white: \033[97m
    bold: \033[1m
    dim: \033[2m
    reset: \033[0m
  banner: STALKER PORTAL IPTV PLAYER  v4.3
