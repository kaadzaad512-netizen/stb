name: Build Android APK

on:
  workflow_dispatch:          # manual "Run workflow" button in Actions tab
  push:
    tags:
      - "v*"                  # auto-build on tags like v4.3

jobs:
  build-apk:
    name: Build APK (Buildozer)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (JDK 17 + build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            cmake build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer "cython<3.1"

      - name: Cache SDK / NDK / buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: bin/*.apk
          if-no-files-found: error
