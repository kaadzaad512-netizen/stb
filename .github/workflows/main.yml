name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    name: Build APK (self-contained)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout (repo may contain only this workflow)
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # All app files are generated here — nothing else in the repo
      # ---------------------------------------------------------------
      - name: Generate iptv.py, main.py, buildozer.spec
        run: |
          cat > iptv.py <<'PYEOF'
          #!/usr/bin/env python3
          """
          Professional Stalker Portal IPTV Player (console, Termux/Pydroid-safe) — v4.3
          Endpoints: handshake, get_profile, get_main_info, get_genres, get_all_channels,
          get_ordered_list (paginated fallback), create_link. Auto MAC generator included.
          """

          import os
          import sys
          import json
          import time
          import random
          import shutil
          import subprocess
          from datetime import datetime

          import requests

          # ---------------------------------------------------------------- colours
          class C:
              R = "\033[91m"; G = "\033[92m"; Y = "\033[93m"; B = "\033[94m"
              M = "\033[95m"; CY = "\033[96m"; W = "\033[97m"; BOLD = "\033[1m"
              DIM = "\033[2m"; END = "\033[0m"

          def cprint(color, text): print(f"{color}{text}{C.END}")

          def banner():
              os.system("cls" if os.name == "nt" else "clear")
              print(f"""{C.CY}{C.BOLD}{'='*58}
                STALKER PORTAL IPTV PLAYER  v4.3
          {'='*58}{C.END}""")

          def one_line(color, msg):
              sys.stdout.write(f"\r{color}{str(msg)[:110]}{C.END}")
              sys.stdout.flush()

          def normalize_mac(raw):
              digits = "".join(ch for ch in raw.strip().upper() if ch in "0123456789ABCDEF")
              if len(digits) != 12:
                  return None
              return ":".join(digits[i:i+2] for i in range(0, 12, 2))

          def generate_mac():
              return f"00:1A:79:{random.randint(0,255):02X}:{random.randint(0,255):02X}:{random.randint(0,255):02X}"

          ZERO_DATES = {"", "0000-00-00", "0000-00-00 00:00:00", "1970-01-01 00:00:00"}

          def expiry_ok(exp):
              exp = str(exp or "").strip()
              if exp in ZERO_DATES: return False
              for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%d"):
                  try:
                      return datetime.strptime(exp[:19], fmt) > datetime.now()
                  except ValueError:
                      continue
              return False

          def is_android():
              return sys.platform == "android" or os.path.exists("/system/bin/am")

          # ---------------------------------------------------------------- client
          class StalkerClient:
              UA = ("Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 "
                    "(KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3")
              XUA = "Model: MAG250; Link: WiFi"

              def __init__(self, portal, mac):
                  self.mac = normalize_mac(mac)
                  if not self.mac:
                      raise ValueError("Invalid MAC address")
                  self.raw_portal = portal.strip().rstrip("/")
                  base = self.raw_portal.removesuffix("/portal.php")
                  if base != self.raw_portal:
                      candidates = [self.raw_portal]
                  elif base.endswith("/c"):
                      candidates = [base + "/portal.php",
                                    base[:-2].rstrip("/") + "/portal.php"]
                  else:
                      candidates = [base + "/c/portal.php",
                                    base + "/portal.php",
                                    base + "/server/portal.php"]
                  self.candidates, self.portal = candidates, candidates[0]
                  self.s = requests.Session()
                  self.s.headers.update({"User-Agent": self.UA, "X-User-Agent": self.XUA,
                                         "Accept": "*/*",
                                         "Referer": "http://localhost/stalker_portal/c/"})
                  self.s.cookies.update({"mac": self.mac, "stb_lang": "en",
                                         "timezone": "Europe/London"})
                  self.token = None
                  self.account = {}

              def _get(self, params):
                  errors = []
                  urls = [self.portal] if self.token else self.candidates
                  for url in urls:
                      try:
                          r = self.s.get(url, params=params, timeout=12)
                          if r.status_code != 200:
                              errors.append(f"{url} -> HTTP {r.status_code}")
                              continue
                          if not r.text.strip():
                              errors.append(f"{url} -> empty body")
                              continue
                          try:
                              data = r.json()
                          except ValueError:
                              errors.append(f"{url} -> non-JSON: {r.text.strip()[:80]!r}")
                              continue
                          self.portal = url
                          return data
                      except requests.RequestException as e:
                          errors.append(f"{url} -> {type(e).__name__}: {e}")
                  raise RuntimeError("Portal request failed:\n  " + "\n  ".join(errors))

              def handshake(self):
                  js = self._get({"type": "stb", "action": "handshake",
                                  "JsHttpRequest": "1-xml"}).get("js", {})
                  self.token = (js.get("token") or "").split("~")[0]
                  if not self.token:
                      raise RuntimeError("handshake ok but no token in response")
                  self.s.headers["Authorization"] = f"Bearer {self.token}"
                  return self.token

              def get_profile(self):
                  return self._get({"type": "stb", "action": "get_profile",
                                    "JsHttpRequest": "1-xml"}).get("js", {})

              def get_main_info(self):
                  js = self._get({"type": "account_info", "action": "get_main_info",
                                  "JsHttpRequest": "1-xml"}).get("js", {})
                  if isinstance(js, list) and js: js = js[0]
                  self.account = js or {}
                  return self.account

              def get_genres(self):
                  try:
                      js = self._get({"type": "itv", "action": "get_genres",
                                      "JsHttpRequest": "1-xml"}).get("js", [])
                      return {str(g["id"]): g["title"] for g in js if isinstance(g, dict)}
                  except Exception:
                      return {}

              def get_all_channels(self, progress=None):
                  chans = []
                  try:
                      js = self._get({"type": "itv", "action": "get_all_channels",
                                      "JsHttpRequest": "1-xml"}).get("js", {})
                      chans = js.get("data", []) if isinstance(js, dict) else (js or [])
                  except Exception:
                      chans = []
                  if not chans:
                      page = 1
                      while True:
                          try:
                              js = self._get({"type": "itv", "action": "get_ordered_list",
                                              "JsHttpRequest": "1-xml",
                                              "type_itv": "1", "p": str(page)}).get("js", {})
                          except Exception:
                              break
                          data = js.get("data", []) if isinstance(js, dict) else (js or [])
                          if not data: break
                          chans.extend(data)
                          if progress: progress(page, len(chans))
                          if not isinstance(js, dict) or page >= int(js.get("max_page", 1) or 1):
                              break
                          page += 1
                  seen, out = set(), []
                  for ch in chans:
                      cid = str(ch.get("id", ""))
                      if cid and cid not in seen:
                          seen.add(cid)
                          out.append({"id": cid, "name": ch.get("name", "?"),
                                      "num": ch.get("number", ""),
                                      "tv_genre_id": str(ch.get("tv_genre_id", ""))})
                  return out

              def create_link(self, channel_id):
                  js = self._get({"type": "itv", "action": "create_link",
                                  "JsHttpRequest": "1-xml",
                                  "cmd": f"ffmpeg http://localhost/ch/{channel_id}"}).get("js", {})
                  url = js.get("cmd", "")
                  for pref in ("ffmpeg ", "vlc ", "http "):
                      if url.startswith(pref):
                          url = url[len(pref):]
                  return url
          PYEOF

          cat > main.py <<'PYEOF'
          #!/usr/bin/env python3
          """Stalker Portal IPTV Player — Kivy APK edition. Engine: iptv.py"""
          import functools
          import threading

          from kivy.app import App
          from kivy.clock import Clock
          from kivy.core.window import Window
          from kivy.metrics import dp
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.button import Button
          from kivy.uix.gridlayout import GridLayout
          from kivy.uix.label import Label
          from kivy.uix.scrollview import ScrollView
          from kivy.uix.spinner import Spinner
          from kivy.uix.textinput import TextInput

          from iptv import StalkerClient, generate_mac, expiry_ok


          def play_url(url, package="org.videolan.vlc"):
              """Open stream in VLC/mpv app — video/* MIME excludes the browser."""
              from kivy.utils import platform
              if platform == "android":
                  from jnius import autoclass
                  Intent = autoclass("android.content.Intent")
                  Uri = autoclass("android.net.Uri")
                  Activity = autoclass("org.kivy.android.PythonActivity")
                  intent = Intent("android.intent.action.VIEW")
                  intent.setDataAndType(Uri.parse(url), "video/*")
                  intent.addFlags(0x10000000)      # FLAG_ACTIVITY_NEW_TASK
                  intent.setPackage(package)       # VLC (org.videolan.vlc) or mpv (is.xyz.mpv)
                  Activity.mActivity.startActivity(intent)
              else:
                  import webbrowser
                  webbrowser.open(url)


          class IPTVRoot(BoxLayout):
              def __init__(self, **kw):
                  super().__init__(orientation="vertical", padding=dp(8), spacing=dp(6), **kw)
                  self.client, self.channels, self.genres = None, [], {}

                  self.connect_panel = BoxLayout(orientation="vertical", spacing=dp(6))
                  self.portal_in = TextInput(hint_text="Portal URL e.g. http://host:8080/c",
                                             multiline=False, size_hint_y=None, height=dp(44))
                  self.mac_in = TextInput(hint_text="MAC e.g. 00:1A:79:D1:FC:C2",
                                          multiline=False, size_hint_y=None, height=dp(44))
                  row = BoxLayout(size_hint_y=None, height=dp(44), spacing=dp(6))
                  btn_mac = Button(text="Random MAC")
                  btn_mac.bind(on_press=lambda *_: setattr(self.mac_in, "text", generate_mac()))
                  btn_go = Button(text="Connect")
                  btn_go.bind(on_press=self.do_connect)
                  row.add_widget(self.mac_in); row.add_widget(btn_mac)
                  self.status = Label(text="Enter portal + MAC", halign="left", valign="middle",
                                      size_hint_y=None, height=dp(70), color=(0.6, 0.9, 0.6, 1))
                  self.status.bind(size=lambda s, *_: s.setter("text_size")(s, s.size))
                  for w in (self.portal_in, row, btn_go, self.status):
                      self.connect_panel.add_widget(w)
                  self.add_widget(self.connect_panel)

                  self.main_panel = BoxLayout(orientation="vertical", spacing=dp(6))
                  self.info = Label(text="", halign="left", size_hint_y=None, height=dp(50),
                                    color=(0.5, 0.8, 1, 1), font_size=dp(12))
                  self.info.bind(size=lambda s, *_: s.setter("text_size")(s, s.size))
                  self.genre_sp = Spinner(text="All genres", size_hint_y=None, height=dp(44))
                  self.genre_sp.bind(text=self.refresh_list)
                  self.search_in = TextInput(hint_text="Search…", multiline=False,
                                             size_hint_y=None, height=dp(44))
                  self.search_in.bind(text=self.refresh_list)
                  self.list_holder = GridLayout(cols=1, size_hint_y=None, spacing=dp(2))
                  self.list_holder.bind(minimum_height=self.list_holder.setter("height"))
                  sv = ScrollView(); sv.add_widget(self.list_holder)
                  for w in (self.info, self.genre_sp, self.search_in, sv):
                      self.main_panel.add_widget(w)

              def run_bg(self, fn):
                  threading.Thread(target=fn, daemon=True).start()

              def ui(self, fn, *a):
                  Clock.schedule_once(lambda *_: fn(*a), 0)

              def set_status(self, msg):
                  self.status.text = str(msg)

              def do_connect(self, *_):
                  portal = self.portal_in.text.strip()
                  if not portal:
                      return
                  if not portal.startswith(("http://", "https://")):
                      portal = "http://" + portal
                  mac = self.mac_in.text.strip()
                  self.set_status("Connecting…")

                  def work():
                      try:
                          cli = StalkerClient(portal, mac)
                          cli.handshake(); cli.get_profile()
                          acc = cli.get_main_info()
                          self.client = cli
                          self.ui(self.on_connected, acc)
                      except Exception as e:
                          self.ui(self.set_status, f"Connect failed: {e}")
                  self.run_bg(work)

              def on_connected(self, acc):
                  exp = str(acc.get("phone", "") or "")
                  mark = "VALID" if expiry_ok(exp) else "expired/none"
                  self.info.text = f"{self.client.portal}\nMAC {self.client.mac} · expiry: {exp or 'n/a'} ({mark})"
                  self.remove_widget(self.connect_panel)
                  self.add_widget(self.main_panel)
                  self.set_status("Loading channels…")
                  self.run_bg(self.load_channels)

              def load_channels(self):
                  self.genres = self.client.get_genres()
                  self.channels = self.client.get_all_channels()
                  self.ui(self.populate)

              def populate(self):
                  opts = ["All genres"] + sorted({self.genres.get(c["tv_genre_id"], "Other")
                                                  for c in self.channels})
                  self.genre_sp.values = opts
                  self.set_status(f"{len(self.channels)} channels loaded")
                  self.refresh_list()

              def refresh_list(self, *_):
                  q = self.search_in.text.strip().lower()
                  g = self.genre_sp.text
                  self.list_holder.clear_widgets()
                  for ch in self.channels:
                      if q and q not in ch["name"].lower():
                          continue
                      if g != "All genres" and self.genres.get(ch["tv_genre_id"], "Other") != g:
                          continue
                      num = str(ch.get("num") or "")
                      b = Button(text=f"{num:>4}  {ch['name']}", size_hint_y=None, height=dp(42),
                                 halign="left", font_size=dp(14))
                      b.bind(on_press=functools.partial(self.play_channel, ch))
                      self.list_holder.add_widget(b)

              def play_channel(self, ch, *_):
                  self.set_status(f"Resolving stream: {ch['name']}…")

                  def work():
                      try:
                          url = self.client.create_link(ch["id"])
                          if url:
                              self.ui(self.set_status, f"▶ Playing: {ch['name']}")
                              play_url(url, "org.videolan.vlc")
                          else:
                              self.ui(self.set_status, "No stream URL returned")
                      except Exception as e:
                          self.ui(self.set_status, f"create_link failed: {e}")
                  self.run_bg(work)


          class IPTVApp(App):
              title = "IPTV Player"

              def build(self):
                  Window.softinput_mode = "below_target"
                  return IPTVRoot()


          if __name__ == "__main__":
              IPTVApp().run()
          PYEOF

          cat > buildozer.spec <<'SPECEOF'
          [app]
          title = IPTV Player
          package.name = iptvplayer
          package.domain = org.iptvplayer
          source.dir = .
          source.include_exts = py
          version = 4.3

          requirements = python3,kivy==2.3.0,requests,pyjnius

          orientation = portrait
          fullscreen = 0

          android.permissions = INTERNET
          android.api = 34
          android.minapi = 24
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPECEOF

          echo "--- Generated files ---"
          ls -la
          python3 -m py_compile iptv.py main.py && echo "Syntax check passed ✓"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system + buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            cmake build-essential ccache
          python -m pip install --upgrade pip wheel
          pip install buildozer "cython<3.1"

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: bin/*.apk
          if-no-files-found: error
