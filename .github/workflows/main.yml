name: Build Python Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libgdbm-dev libsqlite3-dev libbffi-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libffi-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Configure Buildozer Project Blueprint
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = STB Player Pro
          package.name = iptvplayer
          package.domain = org.stb
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0.0
          requirements = python3,kivy==2.3.0,kivymd==1.2.0,requests,urllib3,certifi,idna,charset_normalizer
          orientation = all
          osx.kivy_version = 2.3.0
          fullscreen = 1
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          android.manifest.colors.loader = #0B1020
          android.manifest.colors.background = #0B1020
          android.api = 34
          android.minapi = 24
          android.ndk_api = 24
          android.private_storage = True
          android.permissions = android.permission.INTERNET
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Compile Unsigned Android Debug Package
        run: |
          export BUILDOZER_ALLOW_KIVY_NEW_DESIGN=1
          buildozer android debug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-stalker-app-apk
          path: bin/*.apk
