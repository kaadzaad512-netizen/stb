name: Build Stalker IPTV Mobile Player APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/src/main/java/com/example/stalkeriptv
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "StalkerIPTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }

          wrapper {
              gradleVersion = '8.7'
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.stalkeriptv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.stalkeriptv'
                  minSdk 23
                  targetSdk 35
                  versionCode 4
                  versionName '4.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig true
              }
          }

          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.8.0'
              implementation 'androidx.media3:media3-ui:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
              implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#0A0F1E</color>
              <color name="surface">#121A2B</color>
              <color name="surface2">#1B2740</color>
              <color name="accent">#36D1DC</color>
              <color name="accent2">#5B86E5</color>
              <color name="text">#F5F7FA</color>
              <color name="muted">#9AA7BD</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">#070B14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Stalker IPTV Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/stalkeriptv/MainActivity.java <<'EOF'
          package com.example.stalkeriptv;

          import android.app.Activity;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.datasource.DefaultHttpDataSource;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory;
          import androidx.media3.ui.PlayerView;

          @UnstableApi
          public class MainActivity extends Activity {
              private ExoPlayer player;
              private PlayerView playerView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(10, 15, 30));
                  root.setPadding(24, 48, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("STALKER IPTV");
                  title.setTextSize(28f);
                  title.setTextColor(Color.WHITE);
                  title.setPadding(0, 0, 0, 16);

                  TextView info = new TextView(this);
                  info.setText("Ready to stream content from the configured portal.");
                  info.setTextSize(16f);
                  info.setTextColor(Color.rgb(154, 167, 189));
                  info.setPadding(0, 0, 0, 24);

                  Button playBtn = new Button(this);
                  playBtn.setText("Play demo stream");
                  playBtn.setTextColor(Color.WHITE);
                  playBtn.setBackgroundColor(Color.rgb(54, 209, 220));
                  playBtn.setOnClickListener(v -> playDemoVideo());

                  root.addView(title);
                  root.addView(info);
                  root.addView(playBtn);

                  setContentView(root);
              }

              private void playDemoVideo() {
                  String demoUrl = "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";

                  DefaultHttpDataSource.Factory httpFactory = new DefaultHttpDataSource.Factory()
                          .setAllowCrossProtocolRedirects(true);
                  DefaultMediaSourceFactory mediaSourceFactory = new DefaultMediaSourceFactory(httpFactory);

                  player = new ExoPlayer.Builder(this)
                          .setMediaSourceFactory(mediaSourceFactory)
                          .build();

                  playerView = new PlayerView(this);
                  playerView.setPlayer(player);
                  player.setMediaItem(MediaItem.fromUri(Uri.parse(demoUrl)));
                  player.prepare();
                  player.play();

                  LinearLayout container = new LinearLayout(this);
                  container.setOrientation(LinearLayout.VERTICAL);
                  container.setBackgroundColor(Color.BLACK);
                  container.addView(playerView, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          420
                  ));
                  setContentView(container);
              }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (player != null) {
                      player.release();
                      player = null;
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StalkerIPTV-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
